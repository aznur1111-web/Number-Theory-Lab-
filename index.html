 answer:"gcd(1071, 462) = 21, with 1071 × (−9) + 462 × 21 = 21. The coefficients are −9 and 21.",
 demo:"euclidean-ext",sample:"1071 462",
 refs:[["Cohen, A Course in Computational Algebraic Number Theory, Section 1.3","https://link.springer.com/book/10.1007/978-3-662-02945-9"],["Knuth, TAOCP Vol. 2, Section 4.5.2, Algorithm X","https://www-cs-faculty.stanford.edu/~knuth/taocp.html"],["Wikipedia, Extended Euclidean algorithm","https://en.wikipedia.org/wiki/Extended_Euclidean_algorithm"]]},
{id:"binary-gcd",title:"Binary GCD (Stein's algorithm)",level:2,kind:"Algorithm",status:"Runnable teaching lab",
 summary:"Binary GCD computes the GCD using only subtraction and division by 2. It avoids the modulo operation, which is slow on some hardware.",
 mental:"Halve until odd, subtract, repeat",
 mentalText:"Remove factors of 2 from both numbers. If one is even, halve it. If both are odd, subtract the smaller from the larger. Repeat.",
 steps:["Remove common factors of 2.","If one number is even, halve it.","If both are odd, replace the larger with the difference.","Repeat until one number is zero. The other is the GCD."],
 pseudo:"binary_gcd(u, v):\n  if u == 0: return v\n  if v == 0: return u\n  shift = 0\n  while ((u | v) & 1) == 0:\n    u >>= 1; v >>= 1; shift++\n  while (u & 1) == 0: u >>= 1\n  do:\n    while (v & 1) == 0: v >>= 1\n    if u > v: u, v = v, u\n    v = v - u\n  while v != 0\n  return u << shift",
 invariant:"The GCD is multiplied by 2^shift where shift is the number of common factors of 2 removed at the start.",
 uses:"Embedded systems, hardware GCD units, big integer libraries on CPUs with slow division.",
 strength:"Uses only shifts, subtraction and comparison. No division needed.",
 limits:"More iterations than the Euclidean algorithm in the worst case.",
 pitfall:"The shift count must be restored at the end. Forgetting it gives the GCD divided by a power of two.",
 question:"Why is binary GCD useful in hardware?",
 answer:"Shifts and subtraction are much cheaper than integer division on most processors, so binary GCD can be faster despite doing more iterations.",
 demo:"binary-gcd",sample:"1071 462",
 refs:[["Stein, Computational problems in algebraic number theory, 1967","https://doi.org/10.1145/321386.321389"],["Knuth, TAOCP Vol. 2, Section 4.5.2, Algorithm B","https://www-cs-faculty.stanford.edu/~knuth/taocp.html"],["Crandall and Pomerance, Section 2.3","https://www.math.dartmouth.edu/~carlp/"]]},
/* Chapter 2 */
{id:"modular-exp",title:"Modular exponentiation",level:2,kind:"Algorithm",status:"Runnable teaching lab",
 summary:"Modular exponentiation computes a^b mod m efficiently using square-and-multiply. It is the core operation in RSA and Diffie-Hellman.",
 mental:"Squaring and multiplying selectively",
 mentalText:"Instead of multiplying a by itself b times, use the binary expansion of b. Square the result at each step, multiply by a when the bit is 1.",
 steps:["Write the exponent in binary.","Start with result = 1.","For each bit from left to right: square the result.","If the bit is 1, multiply by the base.","Reduce modulo m at each step."],
 pseudo:"modexp(a, b, m):\n  result = 1\n  a = a mod m\n  while b > 0:\n    if b & 1: result = (result * a) mod m\n    a = (a * a) mod m\n    b >>= 1\n  return result\n\nCost: O(log b) multiplications",
 uses:"RSA encryption and decryption, Diffie-Hellman key exchange, primality tests, cryptographic signatures.",
 strength:"Reduces O(b) multiplications to O(log b). Handles huge exponents.",
 limits:"Side-channel attacks can recover the exponent from the timing of the multiplications. Constant-time implementations are needed for security.",
 pitfall:"Reducing modulo m after each multiplication is essential. Computing a^b first and reducing at the end will overflow.",
 question:"How many multiplications does modexp(2, 1000, 1000000007) need?",
 answer:"About 2 × log2(1000) ≈ 20 multiplications. The exact count depends on the number of set bits in the exponent.",
 demo:"modexp",sample:"2 1000 1000000007",
 refs:[["Cohen, A Course in Computational Algebraic Number Theory, Section 1.2","https://link.springer.com/book/10.1007/978-3-662-02945-9"],["Knuth, TAOCP Vol. 2, Section 4.6.3","https://www-cs-faculty.stanford.edu/~knuth/taocp.html"],["Wikipedia, Modular exponentiation","https://en.wikipedia.org/wiki/Modular_exponentiation"]]},
{id:"modular-inverse",title:"Modular inverse",level:2,kind:"Algorithm",status:"Runnable teaching lab",
 summary:"The modular inverse of a modulo m is the number x such that a × x ≡ 1 (mod m). It exists only when gcd(a, m) = 1.",
 mental:"Undoing multiplication in modular arithmetic",
 mentalText:"In normal arithmetic, the inverse of 3 is 1/3. In modular arithmetic, it is the number you multiply by to get back to 1.",
 steps:["Check that gcd(a, m) = 1.","Run the extended Euclidean algorithm on a and m.","The Bézout coefficient old_s is the inverse.","Reduce old_s modulo m to get a positive value."],
 pseudo:"modinv(a, m):\n  g, x, y = extended_gcd(a, m)\n  if g != 1: raise error('no inverse')\n  return x mod m\n\nCondition: gcd(a, m) = 1 is necessary and sufficient.",
 invariant:"a × a^(-1) ≡ 1 (mod m). The inverse is unique modulo m.",
 uses:"RSA, ECC, CRT reconstruction, solving linear congruences.",
 strength:"Simple extension of the Euclidean algorithm.",
 limits:"Does not exist when gcd(a, m) > 1. Fails silently if you forget to check.",
 pitfall:"Computing a^(-1) mod m when gcd(a, m) > 1 gives a wrong answer. Always check the GCD first.",
 question:"What is the modular inverse of 7 modulo 13?",
 answer:"2, because 7 × 2 = 14 ≡ 1 (mod 13).",
 demo:"modinv",sample:"7 13",
 refs:[["Cohen, Section 1.3.2 Modular inverse","https://link.springer.com/book/10.1007/978-3-662-02945-9"],["Knuth, TAOCP Vol. 2, Section 4.5.2","https://www-cs-faculty.stanford.edu/~knuth/taocp.html"],["Wikipedia, Modular multiplicative inverse","https://en.wikipedia.org/wiki/Modular_multiplicative_inverse"]]},
{id:"crt",title:"Chinese remainder theorem",level:3,kind:"Theorem",status:"Runnable teaching lab",
 summary:"The Chinese remainder theorem says that a system of congruences with pairwise coprime moduli has a unique solution modulo the product of the moduli.",
 mental:"Reconstructing a number from its remainders",
 mentalText:"If you know the remainder when divided by 3, by 5 and by 7, you can reconstruct the number modulo 105.",
 steps:["Check that the moduli are pairwise coprime.","Compute the product M of all moduli.","For each modulus, compute M_i = M / m_i.","Find the inverse of M_i modulo m_i.","Combine: x = sum a_i × M_i × inv(M_i, m_i) mod M."],
 pseudo:"Given: x ≡ a_1 (mod m_1), ..., x ≡ a_k (mod m_k)\nwith pairwise coprime m_i\n\nM = m_1 × m_2 × ... × m_k\nM_i = M / m_i\nx = sum a_i × M_i × inv(M_i, m_i) mod M",
 invariant:"The moduli must be pairwise coprime. Without this, a solution may not exist or may not be unique.",
 uses:"RSA speedup, big integer arithmetic, parallel computation, secret sharing.",
 strength:"Lets you work with small moduli and combine the results.",
 limits:"Requires pairwise coprime moduli. Non-coprime moduli need the generalized version with compatibility conditions.",
 pitfall:"If gcd(m_i, m_j) > 1 and the residues are not compatible, no solution exists.",
 question:"x ≡ 2 (mod 3), x ≡ 3 (mod 5), x ≡ 2 (mod 7). What is x?",
 answer:"x = 23. Check: 23 mod 3 = 2, 23 mod 5 = 3, 23 mod 7 = 2.",
 demo:"crt",sample:"2 3\n3 5\n2 7",
 refs:[["Cohen, Section 1.4 Chinese remainder theorem","https://link.springer.com/book/10.1007/978-3-662-02945-9"],["Knuth, TAOCP Vol. 2, Section 4.3.2","https://www-cs-faculty.stanford.edu/~knuth/taocp.html"],["Wikipedia, Chinese remainder theorem","https://en.wikipedia.org/wiki/Chinese_remainder_theorem"]]},
{id:"euler-fermat",title:"Euler and Fermat theorems",level:3,kind:"Theorem",status:"Runnable teaching lab",
 summary:"Fermat's little theorem: a^(p−1) ≡ 1 (mod p) for prime p and a not divisible by p. Euler's theorem generalizes to a^φ(m) ≡ 1 (mod m) when gcd(a, m) = 1.",
 mental:"A cycle that always returns to 1",
 mentalText:"If you keep multiplying by a modulo m, you eventually cycle. The length of the cycle divides φ(m). So a^φ(m) returns to 1.",
 steps:["Compute φ(m), the number of integers up to m coprime to m.","Check gcd(a, m) = 1.","Then a^φ(m) ≡ 1 (mod m).","For prime m, φ(m) = m − 1, giving Fermat's theorem."],
 pseudo:"Euler's theorem:\n  if gcd(a, m) = 1 then a^φ(m) ≡ 1 (mod m)\n\nFermat's little theorem:\n  if p is prime and gcd(a, p) = 1 then a^(p-1) ≡ 1 (mod p)\n\nEuler's totient function:\n  φ(p) = p - 1 for prime p\n  φ(p^k) = p^(k-1) (p - 1)\n  φ(mn) = φ(m) φ(n) when gcd(m, n) = 1\n  φ(n) = n × ∏ (1 - 1/p) over distinct primes p | n",
 uses:"Primality testing (Fermat test), RSA, modular inverse computation, order of elements.",
 strength:"Foundation of many number theory results and algorithms.",
 limits:"The converse is not true. a^(m−1) ≡ 1 (mod m) does not imply m is prime. Carmichael numbers satisfy this for all a coprime to m.",
 pitfall:"Using Fermat's little theorem as a primality test alone gives false positives. Combine with Miller-Rabin.",
 question:"What is 2^100 mod 101?",
 answer:"1. Since 101 is prime and gcd(2, 101) = 1, Fermat's little theorem gives 2^100 ≡ 1 (mod 101).",
 demo:"euler-fermat",sample:"2 101",
 refs:[["Cohen, Section 1.6 Euler and Fermat","https://link.springer.com/book/10.1007/978-3-662-02945-9"],["Crandall and Pomerance, Section 3.1","https://www.math.dartmouth.edu/~carlp/"],["Wikipedia, Fermat's little theorem","https://en.wikipedia.org/wiki/Fermat%27s_little_theorem"]]},
/* Chapter 3 */
{id:"trial-sieves",title:"Trial division and sieves",level:2,kind:"Primality test",status:"Runnable teaching lab",
 summary:"Trial division tests primality by checking divisibility up to the square root. The Sieve of Eratosthenes finds all primes up to a limit by marking multiples.",
 mental:"Crossing out numbers on a hundred chart",
 mentalText:"Start with 2. Cross out every multiple of 2. Move to the next uncrossed number, which is prime, and cross out its multiples. Repeat.",
 steps:["Create a boolean array of size N+1, all true.","Set index 0 and 1 to false.","For p from 2 to √N: if p is still true, mark all multiples of p as false.","The remaining true indices are primes."],
 pseudo:"Sieve of Eratosthenes:\n  is_prime = [True] * (N+1)\n  is_prime[0] = is_prime[1] = False\n  for p in range(2, floor(sqrt(N)) + 1):\n    if is_prime[p]:\n      for multiple in range(p*p, N+1, p):\n        is_prime[multiple] = False\n\nTrial division:\n  for d in range(2, floor(sqrt(n)) + 1):\n    if n % d == 0: return False\n  return True",
 uses:"Small primes, number theory teaching, the first step in many factorization algorithms.",
 strength:"Very simple and correct. The sieve is fast for finding all primes up to a moderate bound.",
 limits:"Trial division is O(√n) per number. The basic sieve needs O(N) memory.",
 pitfall:"The sieve only tests up to √N, not N. If you go beyond √N you waste time without finding new composites.",
 question:"How many primes are there up to 30?",
 answer:"10: 2, 3, 5, 7, 11, 13, 17, 19, 23 and 29.",
 demo:"sieve",sample:"100",
 refs:[["Crandall and Pomerance, Section 3.1 and 3.2","https://www.math.dartmouth.edu/~carlp/"],["Cohen, Section 1.8 Sieve of Eratosthenes","https://link.springer.com/book/10.1007/978-3-662-02945-9"],["Wikipedia, Sieve of Eratosthenes","https://en.wikipedia.org/wiki/Sieve_of_Eratosthenes"]]},
{id:"miller-rabin",title:"Miller-Rabin primality test",level:3,kind:"Probabilistic test",status:"Runnable teaching lab",
 summary:"Miller-Rabin tests primality by writing n−1 = 2^s × d and checking whether a^d ≡ 1 or a^(2^r × d) ≡ −1 for a random base a.",
 mental:"A witness that certifies compositeness",
 mentalText:"A base a is a witness that n is composite if a^d is not 1 and no power of 2 in the chain gives −1. If a is not a witness, n is probably prime.",
 steps:["Write n−1 = 2^s × d with d odd.","Pick a random base a in [2, n−2].","Compute x = a^d mod n.","If x = 1 or x = n−1, pass.","Otherwise square x up to s−1 times. If any is n−1, pass.","Otherwise a is a witness that n is composite."],
 pseudo:"Miller-Rabin(n, a):\n  d = n - 1\n  s = 0\n  while d is even:\n    d //= 2; s += 1\n  x = modexp(a, d, n)\n  if x == 1 or x == n - 1: return Probably prime\n  for _ in range(s - 1):\n    x = (x * x) mod n\n    if x == n - 1: return Probably prime\n  return Composite\n\nDeterministic bases:\n  n < 2,047: bases 2\n  n < 1,373,653: bases 2, 3\n  n < 25,326,001: bases 2, 3, 5\n  n < 3,215,031,751: bases 2, 3, 5, 7\n  n < 3,474,749,660,383: bases 2, 3, 5, 7, 11, 13, 17",
 uses:"RSA key generation, cryptographic libraries, primality testing in general.",
 strength:"Fast, simple and reliable. Very few bases needed for practical sizes.",
 limits:"Probabilistic unless deterministic bases are used. Error probability is at most 4^(−k) for k random bases.",
 pitfall:"Using Miller-Rabin on even numbers wastes time. Always handle small cases first.",
 question:"How many bases are needed for a number below 3.2 trillion?",
 answer:"Bases 2, 3, 5 and 7 are enough for n < 3,215,031,751. Add 11, 13 and 17 for n < 3,474,749,660,383.",
 demo:"miller-rabin",sample:"104729",
 refs:[["Crandall and Pomerance, Section 3.5 Miller-Rabin","https://www.math.dartmouth.edu/~carlp/"],["Cohen, Section 8.2 Miller-Rabin","https://link.springer.com/book/10.1007/978-3-662-02945-9"],["Miller, Riemann's Hypothesis and tests for primality, JCSS 1976","https://doi.org/10.1016/S0022-0000(76)80043-8"]]},
{id:"solovay-strassen",title:"Solovay-Strassen primality test",level:4,kind:"Probabilistic test",status:"Concept lesson",
 summary:"Solovay-Strassen uses the Jacobi symbol to test primality. It was historically important but has been largely replaced by Miller-Rabin.",
 mental:"Checking whether a quadratic residue rule holds",
 mentalText:"For prime n, the Jacobi symbol equals the Legendre symbol for all bases. If this fails for some base, n is composite.",
 steps:["Pick a random base a in [1, n−1].","Compute gcd(a, n). If greater than 1, n is composite.","Compute the Jacobi symbol (a/n).","Compute a^((n−1)/2) mod n.","If they differ, n is composite. Otherwise n is probably prime."],
 pseudo:"Solovay-Strassen(n, a):\n  if gcd(a, n) > 1: return Composite\n  j = jacobi(a, n)\n  x = modexp(a, (n-1)//2, n)\n  if j == 0 or x != j % n: return Composite\n  return Probably prime\n\nError probability: at most 1/2 per base.",
 uses:"Historical primality testing, teaching the role of the Jacobi symbol.",
 strength:"Simple to describe and implement.",
 limits:"Slower than Miller-Rabin for the same error probability.",
 pitfall:"The Jacobi symbol computation needs care. The naive definition is not computationally efficient.",
 question:"What is the error probability of Solovay-Strassen with k bases?",
 answer:"At most 2^(−k).",
 demo:"none",sample:"",
 refs:[["Solovay and Strassen, A fast Monte-Carlo test for primality, SIAM J. Comput. 1977","https://doi.org/10.1137/0206006"],["Cohen, Section 8.3 Solovay-Strassen","https://link.springer.com/book/10.1007/978-3-662-02945-9"],["Wikipedia, Solovay-Strassen primality test","https://en.wikipedia.org/wiki/Solovay%E2%80%93Strassen_primality_test"]]},
/* Chapter 4 */
{id:"pocklington-proth",title:"Pocklington and Proth tests",level:4,kind:"Primality proof",status:"Concept lesson",
 summary:"Pocklington proves primality using a partial factorization of n−1. Proth tests numbers of the form k × 2^n + 1 with k odd and k < 2^n.",
 mental:"Building a certificate from known factors",
 mentalText:"If you know enough factors of n−1, you can prove n is prime by exhibiting bases that satisfy certain congruences.",
 steps:["Factor enough of n−1.","For each prime factor q of the factored part, find a base a such that a^(n−1) ≡ 1 and gcd(a^((n−1)/q) − 1, n) = 1.","If the factored part exceeds √n, n is prime.","For Proth numbers, test using a = 3 if n is not a square."],
 pseudo:"Pocklington theorem:\n  Let n - 1 = F R with F fully factored and F > √n\n  If for each prime q | F there exists a with\n    a^(n-1) ≡ 1 (mod n) and\n    gcd(a^((n-1)/q) - 1, n) = 1\n  then n is prime.\n\nProth's theorem:\n  n = k 2^m + 1 with k odd and k < 2^m\n  If there exists a with a^((n-1)/2) ≡ -1 (mod n)\n  then n is prime.",
 uses:"Primality proving for specific forms, cryptography, prime number records.",
 strength:"Produces a verifiable certificate of primality, not just a probabilistic result.",
 limits:"Requires a partial factorization of n−1. Not practical for general large numbers.",
 pitfall:"Pocklington's theorem needs F > √n. If the factored part is too small, the proof fails.",
 question:"What form must n have for Proth's theorem?",
 answer:"n = k × 2^m + 1 with k odd and k < 2^m.",
 demo:"none",sample:"",
 refs:[["Crandall and Pomerance, Section 4.3 Pocklington and Proth","https://www.math.dartmouth.edu/~carlp/"],["Cohen, Section 8.4 Pocklington and Proth","https://link.springer.com/book/10.1007/978-3-662-02945-9"],["Pocklington, The determination of the prime or composite nature of large numbers, 1914","https://doi.org/10.1017/S0305004100015880"]]},
{id:"pepin-apr",title:"Pépin and APR-CL tests",level:5,kind:"Primality proof",status:"Concept lesson",
 summary:"Pépin's test checks Fermat numbers F_n = 2^(2^n) + 1 by verifying 3^((F_n−1)/2) ≡ −1. APR-CL is a general-purpose primality proving algorithm.",
 mental:"Special tests for special forms and a general test for any form",
 mentalText:"Pépin's test is fast for Fermat numbers because of their special form. APR-CL works for any number but is more complex.",
 steps:["Pépin: n = 2^(2^k) + 1. Compute 3^((n−1)/2) mod n.","If the result is n−1, n is prime. Otherwise composite.","APR-CL: use Jacobi sums and cyclotomic fields to prove primality.","APR-CL was the first general primality test with subexponential time."],
 pseudo:"Pépin's test:\n  n = 2^(2^k) + 1\n  if 3^((n-1)/2) ≡ -1 (mod n): prime\n  else: composite\n\nAPR-CL:\n  Uses the theory of Jacobi sums over cyclotomic fields\n  Runtime: O((log n)^(c log log log n))\n  First subexponential primality proving algorithm.",
 uses:"Fermat number primality testing, number theory research, historical importance.",
 strength:"Pépin is very fast for Fermat numbers. APR-CL works for any number.",
 limits:"Pépin only works for Fermat numbers. APR-CL is complex and has been largely replaced by ECPP.",
 pitfall:"Pépin's test is only valid for Fermat numbers. Applying it to other numbers gives wrong results.",
 question:"What is the only known Fermat prime beyond 3, 5, 17, 257 and 65537?",
 answer:"None. F_5 through F_32 have been tested and all are composite. It is unknown whether any Fermat primes beyond F_4 exist.",
 demo:"none",sample:"",
 refs:[["Crandall and Pomerance, Section 4.4 Pépin and APR-CL","https://www.math.dartmouth.edu/~carlp/"],["Adleman, Pomerance, Rumely, On distinguishing prime numbers from composite numbers, Annals of Math 1983","https://doi.org/10.2307/2006975"],["Wikipedia, Pépin's test","https://en.wikipedia.org/wiki/P%C3%A9pin%27s_test"]]},
{id:"ecpp",title:"Elliptic curve primality proving (ECPP)",level:5,kind:"Primality proof",status:"Concept lesson",
 summary:"ECPP proves primality by constructing an elliptic curve with a specific order related to n. The proof can be verified quickly even though finding it is expensive.",
 mental:"Building a certificate that anyone can check",
 mentalText:"You find an elliptic curve whose order factors conveniently. That gives you a smaller number to prove prime. Recurse until you reach a known prime.",
 steps:["Pick a discriminant D and compute the Hilbert class polynomial.","Find a root modulo n.","Construct an elliptic curve with that j-invariant.","Compute the order of the curve.","Factor enough of the order and recurse on the factors.","The certificate is the chain of curves and factorizations."],
 pseudo:"ECPP (simplified):\n  1. Choose discriminant D such that n splits in Q(√D)\n  2. Compute j-invariant from the Hilbert class polynomial\n  3. Build elliptic curve E over Z/nZ with that j-invariant\n  4. Compute m = order of E(F_n)\n  5. Write m = c N' with N' > (n^(1/4) + 1)^2\n  6. If N' is prime (recursively), n is prime\n\nExpected time: O((log n)^(4+o(1)))\nCertificate verification: O((log n)^3)",
 uses:"Primality proving for cryptographic primes, prime number records, verification of large primes.",
 strength:"Produces a compact certificate that can be verified quickly.",
 limits:"Finding the certificate is expensive, though the cost is polynomial in log n.",
 pitfall:"The Hilbert class polynomial has degree equal to the class number. For large discriminants this is expensive to compute.",
 question:"Why is ECPP's certificate small even for huge primes?",
 answer:"The certificate is a chain of smaller and smaller elliptic curves and factorizations. Each level shrinks the number, so the total size is polynomial in log n.",
 demo:"none",sample:"",
 refs:[["Atkin and Morain, Elliptic curves and primality proving, Math. Comp. 1993","https://doi.org/10.1090/S0025-5718-1993-1199989-X"],["Morain, Implementing the asymptotically fast version of ECPP, Math. Comp. 2007","https://doi.org/10.1090/S0025-5718-06-01890-4"],["Crandall and Pomerance, Section 4.5 ECPP","https://www.math.dartmouth.edu/~carlp/"],["Wikipedia, Elliptic curve primality proving","https://en.wikipedia.org/wiki/Elliptic_curve_primality_proving"]]},
/* Chapter 5 */
{id:"pollard-rho",title:"Pollard rho factorization",level:4,kind:"Factorization",status:"Runnable teaching lab",
 summary:"Pollard rho finds a factor of a composite number by looking for a cycle in a sequence modulo the (unknown) factor. It is fast for small factors.",
 mental:"A random walk that eventually collides with itself",
 mentalText:"You generate a sequence of numbers modulo n. If n has a small factor p, the sequence modulo p cycles much faster than modulo n. The collision reveals p.",
 steps:["Choose a polynomial f(x) = x^2 + c mod n.","Start with x = y = 2.","Iterate x = f(x), y = f(f(y)).","Compute d = gcd(|x − y|, n).","If d is a nontrivial factor, done. If d = n, retry with different c."],
 pseudo:"Pollard rho(n):\n  if n is even: return 2\n  c = random(1, n-1)\n  x = y = 2\n  d = 1\n  while d == 1:\n    x = (x*x + c) mod n\n    y = (y*y + c) mod n\n    y = (y*y + c) mod n\n    d = gcd(|x - y|, n)\n  if d == n: retry with different c\n  return d\n\nExpected time: O(n^(1/4)) for a factor p ~ sqrt(n)",
 uses:"Factoring numbers with small factors, elliptic curve discrete logs, RSA attacks on weak keys.",
 strength:"Simple and effective for finding small factors. Parallelizable.",
 limits:"Slow for factors of similar size to n. Expected time O(p^(1/2)) where p is the smallest factor.",
 pitfall:"If d = n, the walk found the same collision for all factors. Change the constant c and retry.",
 question:"What is the expected number of iterations for Pollard rho to find a factor p?",
 answer:"About √p iterations by the birthday paradox.",
 demo:"pollard-rho",sample:"8051",
 refs:[["Pollard, A Monte Carlo method for factorization, BIT 1975","https://doi.org/10.1007/BF01933667"],["Brent, An improved Monte Carlo factorization algorithm, BIT 1980","https://doi.org/10.1007/BF01933190"],["Crandall and Pomerance, Section 5.2 Pollard rho","https://www.math.dartmouth.edu/~carlp/"]]},
{id:"pollard-pm1",title:"Pollard p−1 factorization",level:4,kind:"Factorization",status:"Runnable teaching lab",
 summary:"Pollard p−1 finds a factor p when p−1 is smooth. It computes a^M mod n where M is a multiple of many small primes, and takes the GCD.",
 mental:"Exploiting a factor that is one more than a smooth number",
 mentalText:"If p−1 has only small prime factors, then a^M ≡ 1 mod p for a suitable M. So gcd(a^M − 1, n) gives p.",
 steps:["Choose a smoothness bound B.","Compute M = product of prime powers up to B.","Compute a = 2^M mod n.","Compute d = gcd(a − 1, n).","If d is a nontrivial factor, done. Otherwise increase B or retry."],
 pseudo:"Pollard p-1(n, B):\n  a = 2\n  for prime q <= B:\n    a = modexp(a, q^floor(log_q(B)), n)\n  d = gcd(a - 1, n)\n  if 1 < d < n: return d\n  else: retry with larger B or different base\n\nSucceeds when the smallest prime factor p satisfies\n  p - 1 is B-smooth.",
 uses:"Factoring numbers with weak factors, RSA key analysis, number theory research.",
 strength:"Very fast when it works. Complementary to Pollard rho.",
 limits:"Fails when p−1 has a large prime factor. Not useful for strong RSA primes.",
 pitfall:"Using a bound B that is too small misses factors. Too large wastes time.",
 question:"When is Pollard p−1 likely to succeed?",
 answer:"When the smallest factor p has p−1 composed entirely of small prime factors. B must be at least as large as the largest prime factor of p−1.",
 demo:"pollard-pm1",sample:"8051",
 refs:[["Pollard, Theorems on factorization and primality testing, Proc. Cambridge Phil. Soc. 1974","https://doi.org/10.1017/S0305004100049252"],["Crandall and Pomerance, Section 5.3 Pollard p-1","https://www.math.dartmouth.edu/~carlp/"],["Wikipedia, Pollard's p−1 algorithm","https://en.wikipedia.org/wiki/Pollard%27s_p_%E2%88%92_1_algorithm"]]},
{id:"fermat-dixon",title:"Fermat and Dixon factorization",level:4,kind:"Factorization",status:"Concept lesson",
 summary:"Fermat factorization writes n as a difference of squares. Dixon's method uses a factor base and linear algebra over GF(2) to find a congruence of squares.",
 mental:"Finding two squares that differ by n",
 mentalText:"If n = a^2 − b^2, then n = (a−b)(a+b). Dixon generalizes this by finding a combination of squares that works.",
 steps:["Fermat: try a = ceil(√n), b^2 = a^2 − n. If b^2 is a square, done.","Increase a and retry.","Dixon: choose a factor base of small primes.","Find smooth values of x^2 mod n.","Solve a linear system over GF(2) to get a congruence of squares."],
 pseudo:"Fermat factorization:\n  a = ceil(sqrt(n))\n  while True:\n    b2 = a*a - n\n    if b2 is a perfect square: return (a - sqrt(b2), a + sqrt(b2))\n    a += 1\n\nWorks well when n has factors close together.\n\nDixon's method:\n  1. Choose factor base B\n  2. Find x such that x^2 mod n is B-smooth\n  3. Build a matrix of exponents mod 2\n  4. Find linear dependencies over GF(2)\n  5. Each dependency gives a congruence of squares",
 uses:"Factoring numbers with close factors, historical importance, basis of the quadratic sieve.",
 strength:"Fermat is very fast when factors are close. Dixon introduced the factor base idea used in modern methods.",
 limits:"Fermat is slow when factors are far apart. Dixon is subexponential but slower than the quadratic sieve.",
 pitfall:"Fermat factorization iterates a from ceil(√n) upward. If the factors are far apart, the loop runs for a very long time.",
 question:"When does Fermat factorization work best?",
 answer:"When the two factors are close to each other. Then a = (p+q)/2 is close to √n and the loop terminates quickly.",
 demo:"none",sample:"",
 refs:[["Crandall and Pomerance, Section 5.1 Fermat and Section 6.1 Dixon","https://www.math.dartmouth.edu/~carlp/"],["Dixon, Asymptotically fast factorization of integers, Math. Comp. 1981","https://doi.org/10.1090/S0025-5718-1981-0606508-0"],["Wikipedia, Fermat's factorization method","https://en.wikipedia.org/wiki/Fermat%27s_factorization_method"]]},
{id:"cfract-squfof-williams",title:"CFRAC, SQUFOF and Williams p+1",level:5,kind:"Factorization",status:"Concept lesson",
 summary:"CFRAC uses continued fractions to find smooth values. SQUFOF uses quadratic forms. Williams p+1 uses Lucas sequences and succeeds when p+1 is smooth.",
 mental:"Three different smoothness exploits",
 mentalText:"CFRAC looks for smooth values from continued fraction convergents. SQUFOF looks for ambiguous forms. Williams p+1 works when p+1 is smooth instead of p−1.",
 steps:["CFRAC: compute convergents of √n, look for smooth values.","SQUFOF: use the continued fraction expansion of √n to find a square form.","Williams: use Lucas sequences V_k with a^2 − 4b and check gcd(V_M − 2, n).","Each method succeeds under a different smoothness condition."],
 pseudo:"CFRAC:\n  Compute convergents p_k/q_k of sqrt(n)\n  For each k, compute p_k^2 - n q_k^2\n  Look for smooth values\n  Solve a linear system over GF(2)\n\nSQUFOF:\n  Use the continued fraction expansion of sqrt(n)\n  Find an ambiguous form (a, b, c) with a a perfect square\n  The square root gives a factor\n\nWilliams p+1:\n  Choose A, form the Lucas sequence V_0 = 2, V_1 = A\n  V_{k+1} = A V_k - V_{k-1}\n  Compute M as in Pollard p-1\n  d = gcd(V_M - 2, n)",
 uses:"Factoring medium-sized numbers, historical development of factorization algorithms.",
 strength:"Each exploits a different smoothness condition. Together they cover more cases than p−1 alone.",
 limits:"All are superseded for large numbers by the quadratic sieve and the number field sieve.",
 pitfall:"CFRAC and SQUFOF need careful implementation of continued fractions. Numerical precision is important.",
 question:"What is the advantage of Williams p+1 over Pollard p−1?",
 answer:"It succeeds when p+1 is smooth, even if p−1 is not. The two methods are complementary.",
 demo:"none",sample:"",
 refs:[["Williams, A p+1 method of factoring, Math. Comp. 1982","https://doi.org/10.1090/S0025-5718-1982-0658227-7"],["Shanks, SQUFOF notes, 1970s (in Cohen Section 8.6)","https://link.springer.com/book/10.1007/978-3-662-02945-9"],["Crandall and Pomerance, Section 5.4 and 5.5","https://www.math.dartmouth.edu/~carlp/"]]},
/* Chapter 6 */
{id:"bsgs",title:"Baby-step giant-step",level:4,kind:"Discrete logarithm",status:"Runnable teaching lab",
 summary:"BSGS solves g^x ≡ h (mod p) in O(√p) time and space by writing x = i × m + j and precomputing a table of baby steps.",
 mental:"Meeting in the middle of a long walk",
 mentalText:"Instead of searching all exponents, split the search in half. Build a table of the first half and match against the second half.",
 steps:["Choose m = ceil(√(p−1)).","Baby steps: compute g^j for j = 0 to m−1, store in a table.","Giant steps: compute h × (g^(−m))^i for i = 0 to m−1.","When a match is found, x = i × m + j."],
 pseudo:"BSGS(g, h, p):\n  m = ceil(sqrt(p - 1))\n  # Baby steps\n  table = {}\n  e = 1\n  for j in range(m):\n    table[e] = j\n    e = (e * g) mod p\n  # Giant steps\n  factor = modinv(modexp(g, m, p), p)\n  e = h\n  for i in range(m):\n    if e in table:\n      return i * m + table[e]\n    e = (e * factor) mod p\n\nTime and space: O(sqrt(p))",
 uses:"Small discrete logarithm problems, Pohlig-Hellman subroutine, cryptography teaching.",
 strength:"Deterministic and simple. Guaranteed to find the solution if it exists.",
 limits:"Requires O(√p) memory. Impractical for large p.",
 pitfall:"The table must store the smallest j for each value. Overwriting with a larger j gives the wrong answer.",
 question:"How much memory does BSGS need for p ≈ 10^12?",
 answer:"About 10^6 entries, which is manageable. For p ≈ 10^18, it needs 10^9 entries, which is too much.",
 demo:"bsgs",sample:"2 5 23",
 refs:[["Shanks, Class number, a theory of factorization, and genera, 1971","https://doi.org/10.1090/pspum/020/0316385"],["Crandall and Pomerance, Section 5.3.2 BSGS","https://www.math.dartmouth.edu/~carlp/"],["Cohen, Section 5.1 BSGS","https://link.springer.com/book/10.1007/978-3-662-02945-9"]]},
{id:"pollard-log",title:"Pollard rho for discrete logarithms",level:5,kind:"Discrete logarithm",status:"Concept lesson",
 summary:"Pollard rho for logs uses a random walk on the group and the birthday paradox to find a collision that reveals the discrete logarithm.",
 mental:"A random walk that eventually collides with itself",
 mentalText:"You walk randomly in the group, tracking how you got there. When two walks collide, the collision gives an equation you can solve for x.",
 steps:["Partition the group into three sets.","Define a walk: multiply by g in set 1, by h in set 2, by g^2 in set 3.","Track exponents a, b such that current = g^a × h^b.","Run two walks at different speeds until they collide.","Solve g^(a1−a2) = h^(b2−b1) for x."],
 pseudo:"Pollard rho for logs:\n  Define walk function f(y) = y × g (set 0), y × h (set 1), y × g^2 (set 2)\n  Track a, b where y = g^a h^b\n  Floyd cycle finding: x = f(x), y = f(f(y))\n  On collision: g^(a_x - a_y) = h^(b_y - b_x)\n  Solve for x: x = (a_x - a_y) / (b_y - b_x) mod (p-1)\n\nExpected time: O(sqrt(p))",
 uses:"Moderate-size discrete logs, elliptic curve discrete logs, cryptography analysis.",
 strength:"Uses very little memory compared to BSGS.",
 limits:"Not deterministic. May need to restart if the denominator is not invertible.",
 pitfall:"If gcd(b_y − b_x, p−1) > 1, the equation has multiple solutions. You may need to try more than one.",
 question:"How does Pollard rho for logs compare to BSGS in memory?",
 answer:"Pollard rho uses O(1) memory while BSGS uses O(√p). Pollard rho is preferable when memory is limited.",
 demo:"none",sample:"",
 refs:[["Pollard, Monte Carlo methods for index computation mod p, Math. Comp. 1978","https://doi.org/10.1090/S0025-5718-1978-0491431-9"],["Teske, Speeding up Pollard's rho method for computing discrete logarithms, ANTS 1998","https://doi.org/10.1007/BFb0054860"],["Crandall and Pomerance, Section 5.3.3","https://www.math.dartmouth.edu/~carlp/"]]},
{id:"pohlig-hellman",title:"Pohlig-Hellman algorithm",level:4,kind:"Discrete logarithm",status:"Runnable teaching lab",
 summary:"Pohlig-Hellman reduces a discrete logarithm in a group of order N to discrete logs in subgroups of prime order. It works well when N is smooth.",
 mental:"Break the problem into smaller problems",
 mentalText:"If N factors into small primes, you can solve the discrete log one prime at a time and combine the answers with the Chinese remainder theorem.",
 steps:["Factor N into prime powers.","For each prime factor q, solve the discrete log modulo q.","Combine the partial results with CRT.","The full discrete log is the CRT combination."],
 pseudo:"Pohlig-Hellman:\n  Factor N = q_1^e_1 × ... × q_k^e_k\n  For each prime power q^e:\n    Solve discrete log in the subgroup of order q^e\n    (using BSGS or Pollard rho for the small subgroup)\n  Combine all results with CRT\n\nComplexity: O(sum sqrt(q_i)) + factoring cost",
 uses:"Solving discrete logs in groups with smooth order, cryptography analysis, teaching.",
 strength:"Very fast when N is smooth. Reduces a large problem to several small ones.",
 limits:"Slow when N has a large prime factor. Cryptography uses groups with large prime order to prevent this.",
 pitfall:"The method requires factoring N. If N is prime, Pohlig-Hellman gives no speedup over BSGS.",
 question:"Why is it important for cryptographic groups to have large prime order?",
 answer:"Pohlig-Hellman reduces the discrete log to subgroups of prime order. If the order is a product of small primes, the problem becomes easy.",
 demo:"pohlig-hellman",sample:"2 5 23",
 refs:[["Pohlig and Hellman, An improved algorithm for computing logarithms over GF(p), IEEE TIT 1978","https://doi.org/10.1109/TIT.1978.1055833"],["Crandall and Pomerance, Section 5.3.4","https://www.math.dartmouth.edu/~carlp/"],["Cohen, Section 5.2 Pohlig-Hellman","https://link.springer.com/book/10.1007/978-3-662-02945-9"]]},
/* Chapter 7 */
{id:"tonelli-shanks",title:"Tonelli-Shanks modular square root",level:4,kind:"Modular root",status:"Runnable teaching lab",
 summary:"Tonelli-Shanks computes square roots modulo a prime p. It is the standard algorithm for this problem.",
 mental:"Finding the number that squares to a given value",
 mentalText:"Given a and p, find x such that x^2 ≡ a (mod p). If no such x exists, a is a quadratic non-residue.",
 steps:["Check if a is a quadratic residue using Euler's criterion.","Write p−1 = q × 2^s with q odd.","Find a quadratic non-residue z.","Iteratively adjust until you find the square root."],
 pseudo:"Tonelli-Shanks(p, a):\n  if a^((p-1)/2) != 1 (mod p): return no root\n  Write p - 1 = q 2^s with q odd\n  Find z with z^((p-1)/2) = -1 (mod p)\n  M = s, c = z^q, t = a^q, R = a^((q+1)/2)\n  while t != 1:\n    Find least i with t^(2^i) == 1\n    b = c^(2^(M-i-1))\n    M = i, c = b^2, t = t b^2, R = R b\n  return R",
 uses:"Quadratic residue computation, cryptography, elliptic curve point decompression.",
 strength:"Efficient and deterministic for prime moduli.",
 limits:"Requires p to be prime. For composite moduli, other methods are needed.",
 pitfall:"p must be prime. Using Tonelli-Shanks on a composite modulus gives wrong answers.",
 question:"Does 2 have a square root modulo 7?",
 answer:"Yes, 3 and 4. 3^2 = 9 ≡ 2 (mod 7) and 4^2 = 16 ≡ 2 (mod 7).",
 demo:"tonelli",sample:"2 7",
 refs:[["Tonelli, Bemerkung über die Auflösung quadratischer Congruenzen, 1891","https://doi.org/10.1007/BF01199420"],["Shanks, Five number-theoretic algorithms, 1973","https://doi.org/10.1007/BFb0063403"],["Cohen, Section 1.5.1 Tonelli-Shanks","https://link.springer.com/book/10.1007/978-3-662-02945-9"]]},
{id:"cipolla",title:"Cipolla's algorithm",level:5,kind:"Modular root",status:"Concept lesson",
 summary:"Cipolla's algorithm computes square roots modulo a prime by working in the field extension GF(p^2). It is an alternative to Tonelli-Shanks.",
 mental:"Working in a larger field to find the answer",
 mentalText:"You extend the field with an element that is not a square. In that extension, the square root can be computed directly.",
 steps:["Find a such that a^2 − n is a quadratic non-residue.","Work in GF(p^2) as polynomials modulo x^2 − (a^2 − n).","Compute (a + x)^((p+1)/2) in this field.","The result is the square root."],
 pseudo:"Cipolla(p, n):\n  if n^((p-1)/2) != 1: return no root\n  Find a with a^2 - n non-residue mod p\n  Work in GF(p^2) = F_p[x] / (x^2 - (a^2 - n))\n  Compute (a + x)^((p+1)/2)\n  The real part is the square root\n\nExpected time: O(log p) field operations",
 uses:"Modular square roots, cryptography, elliptic curve arithmetic.",
 strength:"Simpler than Tonelli-Shanks in some implementations.",
 limits:"Requires finding a quadratic non-residue, which may take several tries.",
 pitfall:"The element a must be chosen so that a^2 − n is not a square. Otherwise the field extension is not valid.",
 question:"How is Cipolla different from Tonelli-Shanks?",
 answer:"Cipolla works in a quadratic extension field while Tonelli-Shanks stays in the base field. Both solve the same problem.",
 demo:"none",sample:"",
 refs:[["Cipolla, Un metodo per la risoluzione della congruenza di secondo grado, 1903","https://doi.org/10.1007/BF03013217"],["Cohen, Section 1.5.2 Cipolla","https://link.springer.com/book/10.1007/978-3-662-02945-9"],["Wikipedia, Cipolla's algorithm","https://en.wikipedia.org/wiki/Cipolla%27s_algorithm"]]},
{id:"hensel",title:"Hensel lifting",level:4,kind:"Modular root",status:"Runnable teaching lab",
 summary:"Hensel lifting takes a solution modulo p and lifts it to a solution modulo p^k. It is Newton's method for modular arithmetic.",
 mental:"Improving an approximate answer one digit at a time",
 mentalText:"You have a solution modulo p. You want one modulo p^2, then p^3, and so on. Each step uses the derivative to correct the error.",
 steps:["Start with x_0 solving f(x) ≡ 0 (mod p).","Compute f'(x_0) mod p.","If f'(x_0) is not 0 mod p, compute x_1 = x_0 − f(x_0) / f'(x_0) mod p^2.","Repeat to lift to higher powers."],
 pseudo:"Hensel lifting:\n  Given x_k with f(x_k) ≡ 0 (mod p^k)\n  Compute f'(x_k)\n  If gcd(f'(x_k), p) = 1:\n    x_{k+1} = x_k - f(x_k) × inv(f'(x_k), p) mod p^(k+1)\n  else: root may not lift uniquely\n\nThis is Newton's method in the p-adic numbers.",
 uses:"Solving polynomial congruences, factoring polynomials, p-adic arithmetic.",
 strength:"Doubles the precision at each step. Very efficient.",
 limits:"Requires f'(x) not divisible by p. If it is, the root may not lift or may lift in multiple ways.",
 pitfall:"The derivative condition is essential. If f'(x_0) ≡ 0 (mod p), Hensel lifting fails or needs a modified approach.",
 question:"If x_0 = 3 solves x^2 ≡ 2 (mod 7), what is the lift to mod 49?",
 answer:"x_1 = 3 − (9−2)/(2×3) mod 49 = 3 − 7/6 mod 49. Since 6^(−1) mod 49 = 41, x_1 = 3 − 7×41 = 3 − 287 ≡ 10 (mod 49). Check: 10^2 = 100 ≡ 2 (mod 49).",
 demo:"hensel",sample:"2 7",
 refs:[["Hensel, Theorie der algebraischen Zahlen, 1908","https://archive.org/details/theoriederalgeb00hensgoog"],["Cohen, Section 3.5 Hensel lifting","https://link.springer.com/book/10.1007/978-3-662-02945-9"],["Wikipedia, Hensel's lemma","https://en.wikipedia.org/wiki/Hensel%27s_lemma"]]},
/* Chapter 8 */
{id:"karatsuba",title:"Karatsuba multiplication",level:3,kind:"Fast arithmetic",status:"Runnable teaching lab",
 summary:"Karatsuba reduces the number of single-digit multiplications from 4 to 3 when multiplying two 2-digit numbers recursively, giving O(n^1.585) instead of O(n^2).",
 mental:"Trading multiplications for additions",
 mentalText:"Multiplying two large numbers is expensive. Karatsuba does three half-size multiplications instead of four, at the cost of more additions.",
 steps:["Split each number into high and low halves.","Compute three products: high×high, low×low, (high+low)×(high+low).","Combine: result = high×high × base^2n + ((high+low)² − high×high − low×low) × base^n + low×low.","Recurse on the half-size multiplications."],
 pseudo:"Karatsuba(x, y):\n  if x < 10 or y < 10: return x * y\n  n = max(len(x), len(y))\n  half = n // 2\n  a, b = divmod(x, 10^half)\n  c, d = divmod(y, 10^half)\n  ac = Karatsuba(a, c)\n  bd = Karatsuba(b, d)\n  ad_plus_bc = Karatsuba(a + b, c + d) - ac - bd\n  return ac * 10^(2*half) + ad_plus_bc * 10^half + bd\n\nTime: O(n^1.585)",
 uses:"Big integer libraries, cryptography, computer algebra systems.",
 strength:"Faster than the naive algorithm for large numbers. Simple to implement.",
 limits:"The overhead is significant for small numbers. Most libraries switch to naive multiplication below a threshold.",
 pitfall:"The threshold matters. For small numbers, the naive algorithm is faster.",
 question:"Why does Karatsuba do three multiplications instead of four?",
 answer:"The middle product (a+b)(c+d) combines the two cross terms ad + bc into one multiplication, at the cost of extra additions.",
 demo:"karatsuba",sample:"1234 5678",
 refs:[["Karatsuba and Ofman, Multiplication of many-digital numbers by automatic computers, 1962","https://doi.org/10.1007/978-3-642-87190-4_10"],["Knuth, TAOCP Vol. 2, Section 4.3.3","https://www-cs-faculty.stanford.edu/~knuth/taocp.html"],["Crandall and Pomerance, Section 9.5","https://www.math.dartmouth.edu/~carlp/"]]},
{id:"toom-schonhage",title:"Toom-Cook and Schönhage-Strassen",level:5,kind:"Fast arithmetic",status:"Concept lesson",
 summary:"Toom-Cook generalizes Karatsuba to split numbers into k parts. Schönhage-Strassen uses the FFT to achieve O(n log n log log n) complexity.",
 mental:"Splitting into more parts and using the Fourier transform",
 mentalText:"Karatsuba splits into two parts. Toom-Cook splits into three or more. Schönhage-Strassen uses the FFT to multiply polynomials that encode the numbers.",
 steps:["Toom-Cook: split each number into k parts.","Evaluate both polynomials at 2k−1 points.","Multiply pointwise.","Interpolate to get the product coefficients.","Schönhage-Strassen: use the FFT for the polynomial multiplication."],
 pseudo:"Toom-Cook-3:\n  Split x = a_2 B^2 + a_1 B + a_0\n  Split y = b_2 B^2 + b_1 B + b_0\n  Evaluate at 0, 1, -1, 2, infinity\n  Multiply 5 pairs pointwise\n  Interpolate to get coefficients of product\n\nSchönhage-Strassen:\n  Encode numbers as polynomials\n  Multiply polynomials using the FFT\n  Handle carries\n  Time: O(n log n log log n)",
 uses:"Big integer libraries (GMP), computer algebra systems, cryptography.",
 strength:"Schönhage-Strassen is asymptotically faster than Karatsuba and Toom-Cook.",
 limits:"The constant factors are large. Schönhage-Strassen is only faster for very large numbers.",
 pitfall:"Toom-Cook needs exact interpolation. Division by small integers can cause problems in integer arithmetic.",
 question:"What is the asymptotic complexity of Schönhage-Strassen?",
 answer:"O(n log n log log n).",
 demo:"none",sample:"",
 refs:[["Toom, The complexity of a scheme of functional elements realizing the multiplication of integers, 1963","https://doi.org/10.1070/RM1963v018n03ABEH001134"],["Schönhage and Strassen, Schnelle Multiplikation grosser Zahlen, Computing 1971","https://doi.org/10.1007/BF02242355"],["Crandall and Pomerance, Section 9.5.5","https://www.math.dartmouth.edu/~carlp/"]]},
{id:"ntt",title:"Number theoretic transform (NTT)",level:5,kind:"Fast arithmetic",status:"Concept lesson",
 summary:"The NTT is the FFT over a finite field. It is used for fast polynomial multiplication modulo a prime, without floating point precision issues.",
 mental:"The FFT without floating point error",
 mentalText:"The FFT uses complex numbers. The NTT uses a finite field where a primitive root of unity exists. The result is exact.",
 steps:["Choose a prime p with p−1 divisible by a power of 2.","Find a primitive n-th root of unity ω.","Apply the NTT to both polynomials.","Multiply pointwise.","Apply the inverse NTT."],
 pseudo:"NTT:\n  Choose p = c 2^k + 1 with ω a primitive n-th root of unity\n  NTT(a) = sum a_j ω^(ij) mod p\n  Inverse NTT uses ω^(-1) and divides by n\n\nCommon primes:\n  998244353 = 119 × 2^23 + 1\n  1004535809 = 479 × 2^21 + 1",
 uses:"Polynomial multiplication, big integer multiplication, cryptography (lattice-based), competitive programming.",
 strength:"Exact arithmetic. No floating point error.",
 limits:"Requires a prime with a suitable root of unity. Not all sizes are supported.",
 pitfall:"The modulus must have enough factors of 2. If the polynomial is longer than the supported power of 2, you need a different prime or the CRT.",
 question:"What is the advantage of NTT over FFT for polynomial multiplication?",
 answer:"NTT uses exact modular arithmetic, so there is no floating point rounding error. This is critical for cryptography and exact computer algebra.",
 demo:"none",sample:"",
 refs:[["Crandall and Pomerance, Section 9.5.3 NTT","https://www.math.dartmouth.edu/~carlp/"],["Cohen, Section 2.4.2 NTT","https://link.springer.com/book/10.1007/978-3-662-02945-9"],["Wikipedia, Number theoretic transform","https://en.wikipedia.org/wiki/Number_theoretic_transform"]]},
/* Chapter 9 */
{id:"prime-counting",title:"Prime-counting functions",level:3,kind:"Counting",status:"Runnable teaching lab",
 summary:"π(x) counts the number of primes up to x. ψ(x) and θ(x) are weighted versions. The prime number theorem says π(x) ∼ x / ln x.",
 mental:"Counting how many primes there are below a limit",
 mentalText:"There are more primes below 100 than below 10. The prime number theorem tells you roughly how many there are without listing them.",
 steps:["Choose a value x.","Count primes up to x with a sieve.","For larger x, use the Meissel-Lehmer method.","Compare with the asymptotic x / ln x."],
 pseudo:"π(x) = number of primes <= x\n\nPrime number theorem:\n  π(x) ~ x / ln(x)\n  More precisely: π(x) = li(x) + O(x e^(-c sqrt(ln x)))\n\nθ(x) = sum_{p <= x} ln p\nψ(x) = sum_{p^k <= x} ln p\nChebyshev functions",
 uses:"Analytic number theory, cryptography (prime density estimates), algorithm analysis.",
 strength:"Gives a quick estimate of prime density.",
 limits:"The asymptotic is not accurate for small x. For exact values, you need a sieve or Meissel-Lehmer.",
 pitfall:"π(x) is not the same as x / ln x. The approximation is only good for large x.",
 question:"Approximately how many primes are there below 10^6?",
 answer:"About 10^6 / ln(10^6) ≈ 72382. The actual value is 78498.",
 demo:"prime-counting",sample:"1000",
 refs:[["Crandall and Pomerance, Chapter 1 Prime number theorem","https://www.math.dartmouth.edu/~carlp/"],["Riesel, Prime Numbers and Computer Methods for Factorization, Birkhäuser 1994","https://link.springer.com/book/10.1007/978-1-4612-0251-6"],["Wikipedia, Prime-counting function","https://en.wikipedia.org/wiki/Prime-counting_function"]]},
{id:"meissel-lehmer",title:"Meissel-Lehmer method",level:5,kind:"Counting",status:"Concept lesson",
 summary:"The Meissel-Lehmer method computes π(x) in O(x^(2/3)/log x) time, much faster than sieving up to x.",
 mental:"Counting without listing",
 mentalText:"Instead of finding every prime, the method uses a recursive formula that counts them in bulk.",
 steps:["Choose a value y around x^(1/3).","Sieve primes up to y.","Use the recursive formula φ(x, a) for the count.","Combine with the prime list to get π(x)."],
 pseudo:"Meissel-Lehmer:\n  Let y = x^(1/3), a = π(y)\n  π(x) = φ(x, a) + a - 1\n\nwhere φ(x, a) counts integers <= x not divisible by the first a primes.\n\nRecursion:\n  φ(x, 0) = x\n  φ(x, a) = φ(x, a-1) - φ(x / p_a, a-1)\n\nOptimized: O(x^(2/3) / log x) time, O(x^(1/3)) space",
 uses:"Computing π(x) for large x, number theory research, verifying prime counts.",
 strength:"Much faster than sieving for large x.",
 limits:"Still too slow for extremely large x. Analytic methods are used for record computations.",
 pitfall:"The choice of y affects both time and space. y around x^(1/3) is usually optimal.",
 question:"How much faster is Meissel-Lehmer than sieving for π(10^18)?",
 answer:"Sieving 10^18 numbers is impossible. Meissel-Lehmer runs in O(10^12 / log 10^18) ≈ 10^10 operations, which is feasible on modern hardware.",
 demo:"none",sample:"",
 refs:[["Lagarias, Miller, Odlyzko, Computing π(x): the Meissel-Lehmer method, Math. Comp. 1985","https://doi.org/10.1090/S0025-5718-1985-0777281-1"],["Riesel, Prime Numbers and Computer Methods, Chapter 2","https://link.springer.com/book/10.1007/978-1-4612-0251-6"],["Wikipedia, Meissel-Lehmer algorithm","https://en.wikipedia.org/wiki/Meissel%E2%80%93Lehmer_algorithm"]]},
{id:"arithmetic-functions",title:"Arithmetic functions and Möbius inversion",level:4,kind:"Number theory",status:"Runnable teaching lab",
 summary:"Arithmetic functions map positive integers to numbers. Multiplicative functions factor over primes. Möbius inversion relates sums over divisors.",
 mental:"Functions that depend on the prime factorization",
 mentalText:"φ(n) counts numbers coprime to n. σ(n) sums the divisors. μ(n) is +1, −1 or 0 depending on the prime factorization.",
 steps:["Define the function.","Check if it is multiplicative.","Compute it from the prime factorization.","Use Möbius inversion to relate f and its divisor sum."],
 pseudo:"Common arithmetic functions:\n  φ(n): Euler totient, count of k <= n with gcd(k, n) = 1\n  σ(n): sum of divisors\n  τ(n): number of divisors\n  μ(n): Möbius function\n\nMöbius inversion:\n  If g(n) = sum_{d | n} f(d) then f(n) = sum_{d | n} μ(d) g(n/d)\n\nMultiplicative: f(mn) = f(m) f(n) when gcd(m, n) = 1",

function parseNums(s){
 const a=s.trim().split(/[\s,]+/).filter(Boolean).map(Number);
 if(!a.length||a.some(x=>!Number.isFinite(x)))throw Error('Enter space or comma separated numbers.');
 return a;
}

function demoGcd(text){
 const [a,b]=parseNums(text).map(n=>BigInt(Math.abs(n)));
 if(a===undefined||b===undefined)throw Error('Enter two integers, for example: 1071 462');
 function gcdEuclid(x,y){while(y!==0n){[x,y]=[y,x%y]}return x<0n?-x:x}
 function gcdSubtract(x,y){x=x<0n?-x:x;y=y<0n?-y:y;while(x!==y){if(x>y)x-=y;else y-=x}return x}

  decoded:`The Euclidean algorithm repeatedly replaces (a, b) with (b, a mod b) until b = 0. The last nonzero remainder is the GCD.\n\nThe subtractive version replaces the larger by the difference. It is correct but slow when the numbers have very different magnitudes.\n\nGCD is used in fraction simplification, modular arithmetic and many number theory algorithms.`,
  steps:2,units:2,tokens:2
 };
}
function demoEuclideanExt(text){
 const [a,b]=parseNums(text).map(n=>BigInt(n));
 if(a===undefined||b===undefined)throw Error('Enter two integers, for example: 1071 462');
 let oldR=a,r=b,oldS=1n,s=0n,oldT=0n,t=1n;
 const steps=[];
 while(r!==0n){
  const q=oldR/r;
  steps.push({q,a:oldR,b:r,r});
  [oldR,r]=[r,oldR-q*r];
  [oldS,s]=[s,oldS-q*s];
  [oldT,t]=[t,oldT-q*t];
 }
 const gcd=oldR;
 return {
  encoded:`a = ${a}, b = ${b}\n\nEuclidean steps:\n${steps.map((x,i)=>`  ${x.a} = ${x.b} × ${x.q} + ${x.r}`).join('\n')}\n\ngcd(${a}, ${b}) = ${gcd}\n\nBézout coefficients:\n  ${oldS} × ${a} + ${oldT} × ${b} = ${gcd}\n  check: ${oldS*a+oldT*b}`,
  decoded:`The extended Euclidean algorithm tracks the Bézout coefficients alongside the Euclidean divisions. At the end, oldS and oldT satisfy oldS*a + oldT*b = gcd(a, b).\n\nThis is the basis for computing modular inverses. The inverse of a modulo m is the Bézout coefficient s when gcd(a, m) = 1.`,
  steps:steps.length,units:steps.length,tokens:3
 };
}
function demoBinaryGcd(text){
 const [a,b]=parseNums(text).map(n=>BigInt(n));
 let u=a<0n?-a:a,v=b<0n?-b:b;
 if(u===0n||v===0n)throw Error('Neither number can be zero');
 let shift=0;
 while(((u|v)&1n)===0n){u>>=1n;v>>=1n;shift++}
 while((u&1n)===0n)u>>=1n;
 while(v!==0n){
  while((v&1n)===0n)v>>=1n;

  v=v-u;
 }

  encoded:`a = ${a}, b = ${b}\n\nBinary GCD result: ${gcd}\nCheck with Euclidean: ${(()=>{let x=a<0n?-a:a,y=b<0n?-b:b;while(y){[x,y]=[y,x%y]}return x})()}`,
  decoded:`Binary GCD removes common factors of 2 first, then uses only subtraction and halving. It avoids the modulo operation, which can be slow on some hardware.\n\nThe shift count records how many factors of 2 were removed at the start. They are restored at the end by shifting left.`,
  steps:2,units:2,tokens:2
 };
}

/* ============================================================
   State and shell
   ============================================================ */
const state={page:'home',current:null,completed:new Set(),bookmarks:new Set(),theme:'system',drafts:{}};
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1900)}
function save(){try{localStorage.setItem('az-number-theory-lab-v1',JSON.stringify({schemaVersion:1,completed:[...state.completed],bookmarks:[...state.bookmarks],theme:state.theme,current:state.current,drafts:state.drafts}))}catch(e){}}
function load(){try{const d=JSON.parse(localStorage.getItem('az-number-theory-lab-v1')||'null');if(!d||d.schemaVersion!==1)return;
 state.completed=new Set((d.completed||[]).filter(id=>byId[id]));
 state.bookmarks=new Set((d.bookmarks||[]).filter(id=>byId[id]));
 state.theme=['system','light','dark'].includes(d.theme)?d.theme:'system';
 state.current=byId[d.current]?d.current:null;
 state.drafts=d.drafts&&typeof d.drafts==='object'?d.drafts:{};}catch(e){}}
function applyTheme(){let t=state.theme;if(t==='system')t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';document.documentElement.dataset.theme=t;$('#themeSelect').value=state.theme}
function getChapter(id){return CHAPTERS.find(c=>c.ids.includes(id))||CHAPTERS[0]}
function progress(){
 const n=state.completed.size,t=LESSONS.length;
 $('#progressText').textContent=`${n} / ${t}`;
 $('#progressFill').style.width=(n/t*100)+'%';
 $('#lessonCount').textContent=t+' lessons';
 $('#catalogCount').textContent=`${CHAPTERS.length} chapters · ${t} lessons · ${LESSONS.filter(l=>l.demo&&l.demo!=='none').length} labs`;
 $('#progressBar').setAttribute('aria-valuenow',String(Math.round(n/t*100)));
}
function renderTree(){
 const q=$('#searchInput').value.toLowerCase().trim(),ch=$('#chapterFilter').value;
 const root=$('#courseTree');root.textContent='';
 for(const c of CHAPTERS){
  if(ch!=='all'&&c.id!==ch)continue;
  const rows=c.ids.map(id=>byId[id]).filter(x=>x&&(!q||(x.title+' '+x.summary+' '+x.kind+' '+c.title).toLowerCase().includes(q)));
  if(!rows.length)continue;
  const group=document.createElement('section');
  const label=document.createElement('div');label.className='group-label';
  label.innerHTML=`<span>${esc(c.title)}</span><span>${rows.length}</span>`;
  group.append(label);
  rows.forEach(l=>{
   const b=document.createElement('button');b.type='button';
   b.className='link'+(state.current===l.id?' active':'');
   b.dataset.lesson=l.id;
   b.innerHTML=`<span class="num">${String(LESSONS.indexOf(l)+1).padStart(2,'0')}</span><span class="name">${esc(l.title)}</span>${state.completed.has(l.id)?'<span class="done" aria-label="completed">✓</span>':''}`;
   group.append(b);
  });
  root.append(group);
 }
 if(!root.children.length)root.innerHTML='<p class="muted">No matching lessons. Try another search.</p>';
 progress();
}
function listToHTML(a){return `<ol class="steps">${a.map(x=>`<li>${esc(x)}</li>`).join('')}</ol>`}
function refsHTML(r){return r&&r.length?`<div class="references">${r.map(x=>`<a target="_blank" rel="noopener noreferrer" href="${esc(x[1])}">${esc(x[0])} ↗</a>`).join('')}</div>`:'<p class="muted">See the recommended textbooks and papers for a full treatment.</p>'}
function codeRecord(l){if(l.codeKey==='none')return null;return CODE[l.codeKey]||CODE[l.demo]||null}
function codeText(l){
 const c=codeRecord(l);
 if(c&&c.python)return c.python;
 return '# CONCEPT OUTLINE, NOT EXECUTABLE PYTHON\n# Lesson: '+l.title+'\n\n# Core idea\n# '+String(l.summary||'').replace(/\n/g,'\n# ')+'\n\n# Pseudocode from the lesson\n'+String(l.pseudo||'').split('\n').map(x=>'# '+x).join('\n')+'\n';
}
function statusClass(l){return /Runnable/.test(l.status)?'good':'warn'}

function renderLesson(id){
 const l=byId[id];if(!l){renderHome();return}
 state.page='lesson';state.current=id;
 const c=getChapter(id);const index=LESSONS.indexOf(l);const next=LESSONS[(index+1)%LESSONS.length];
 const hasDemo=l.demo&&l.demo!=='none';
 const demoArea=hasDemo?`<section class="panel"><div class="panel-head"><h2>${esc(l.demoTitle||'Interactive teaching lab')}</h2><p>Everything runs in your browser as a teaching implementation. For real work use GMP, PARI/GP, SageMath or another vetted library.</p></div><div class="body"><div class="lab-top"><label for="labInput">Input</label><button class="btn" id="resetSample">Reset sample</button><button class="btn primary" id="runLab">Run lab</button></div><textarea class="lab-input" id="labInput" aria-label="Lab input">${esc(l.sample||'')}</textarea><div class="notice info"><strong>Format:</strong> enter the numbers requested, separated by spaces or commas. For congruence systems, use one congruence per line.</div><div class="lab-cols"><div><div class="label">Output</div><div class="lab-output" id="labEncoded">Run the lab to see output.</div></div><div><div class="label">Explanation</div><div class="lab-output" id="labDecoded">Step notes appear here.</div></div></div></div></section>`:'';
 const references=refsHTML(l.refs);
 const code=state.drafts[id]??codeText(l);
 $('#mainView').innerHTML=`<div class="breadcrumb">Number Theory Lab / ${esc(c.title)}</div>
<header class="header">
 <div class="eyebrow">LESSON ${String(index+1).padStart(2,'0')} · ${esc(l.kind)}</div>
 <h1>${esc(l.title)}</h1>
 <p>${esc(l.summary)}</p>
 <div class="tags"><span class="tag">Level ${l.level}</span><span class="tag ${statusClass(l)}">${esc(l.status)}</span><span class="tag">${esc(c.title.replace(/^\d+\.\s*/,''))}</span></div>
 <div class="header-actions">
  <button class="btn" id="bookmarkBtn">${state.bookmarks.has(id)?'★ Bookmarked':'☆ Bookmark'}</button>
  <button class="btn primary" id="completeBtn">${state.completed.has(id)?'✓ Completed':'Mark complete'}</button>
 </div>
</header>
<section class="panel"><div class="panel-head"><h2>1. Understand the idea</h2><p>Plain language and a mental picture</p></div><div class="body idea"><div><p>${esc(l.summary)}</p><p><strong>What problem it solves:</strong> ${esc(l.problem)}</p><div class="takeaway"><strong>Takeaway:</strong> ${esc(l.output)}</div></div><aside class="mental"><small>Mental picture</small><strong>${esc(l.mental)}</strong><p>${esc(l.mentalText)}</p></aside></div></section>
<section class="panel"><div class="panel-head"><h2>2. Input and output</h2><p>Know what goes in and what comes out</p></div><div class="body two"><div class="mini"><h3>Input</h3><p>${esc(l.input)}</p></div><div class="mini"><h3>Output</h3><p>${esc(l.output)}</p></div></div></section>
<section class="panel"><div class="panel-head"><h2>3. How it works</h2><p>Step by step, with the key rule that makes it correct</p></div><div class="body two"><div>${listToHTML(l.steps)}<div class="takeaway" style="margin-top:14px"><strong>Key rule:</strong> ${esc(l.invariant)}</div></div><pre class="pseudo">${esc(l.pseudo)}</pre></div><div class="table-wrap" style="margin-top:16px"><table><thead><tr><th>Step</th><th>What happens</th><th>Why it matters</th></tr></thead><tbody>${l.trace.map(r=>`<tr>${r.map(v=>`<td>${esc(v)}</td>`).join('')}</tr>`).join('')}</tbody></table></div></section>
${demoArea}
<section class="panel"><div class="panel-head"><h2>4. Cost and stability</h2><p>Costs depend on input size and the exact algorithm. These are scope labels, not universal benchmarks.</p></div><div class="body"><div class="tiles">${l.complexity.map((x,i)=>`<div class="tile"><span>${['Time','Storage','Numerics'][i]}</span><strong>${esc(x.split(' ').slice(0,2).join(' '))}</strong><small>${esc(x)}</small></div>`).join('')}</div><div class="two" style="margin-top:12px"><div class="mini"><h3>Strengths</h3><p>${esc(l.strength)}</p></div><div class="mini"><h3>Limits</h3><p>${esc(l.limits)}</p></div></div></div></section>
<section class="panel"><div class="panel-head"><h2>5. Code and usage</h2><p>Reference code is for learning. Real number theory code should use GMP, PARI/GP, SageMath or another vetted library.</p></div><div class="code-head"><div><span class="tag">${codeRecord(l)?'Python example':'Concept outline, not executable'}</span> <span class="tag">Editable</span></div><div class="header-actions" style="margin:0"><button class="btn" id="copyCode">Copy code</button><button class="btn" id="downloadCode">Download</button></div></div><textarea id="codeEditor" class="code-editor" spellcheck="false" aria-label="Editable Python code">${esc(code)}</textarea><div class="code-foot"><span>${codeRecord(l)?'Reference example. The in-page lab runs its own JavaScript implementation.':'Lesson-specific outline, not an implementation.'}</span><span id="codeStatus">Local draft</span></div><div class="body"><div class="mini"><h3>Where it is used</h3><p>${esc(l.uses)}</p></div><div class="notice" style="margin-top:12px"><strong>Common pitfall:</strong> ${esc(l.pitfall)}</div></div></section>
<section class="panel"><div class="panel-head"><h2>6. Choices and alternatives</h2><p>Pick based on the input size, structure and required guarantee</p></div><div class="body two"><div class="mini"><h3>When to use this</h3><p>${esc(l.strength)}</p></div><div class="mini"><h3>When to use something else</h3><p>${esc(l.limits)}</p></div></div></section>
<section class="panel"><div class="panel-head"><h2>7. Check yourself</h2><p>Try to answer before you open the explanation</p></div><div class="body"><details class="practice"><summary>${esc(l.question)}</summary><p>${esc(l.answer)}</p></details></div></section>
<section class="panel"><div class="panel-head"><h2>8. References</h2><p>Standard references for this topic</p></div><div class="body">${references}<p class="muted" style="font-size:11.5px;margin-top:14px">The labs on this page are teaching implementations. For production work use GMP, PARI/GP, SageMath or another vetted library.</p></div></section>
<footer class="footer"><span>Az Number Theory Lab · local learning</span><span>Lesson ${index+1} of ${LESSONS.length} · Next: ${esc(next.title)}</span><button class="btn" id="nextLesson">Next →</button></footer>`;

 $('#bookmarkBtn').onclick=()=>{state.bookmarks.has(id)?state.bookmarks.delete(id):state.bookmarks.add(id);save();renderLesson(id);toast(state.bookmarks.has(id)?'Bookmarked':'Bookmark removed')};
 $('#completeBtn').onclick=()=>{state.completed.has(id)?state.completed.delete(id):state.completed.add(id);save();renderTree();renderLesson(id);toast(state.completed.has(id)?'Lesson completed':'Completion removed')};
 $('#nextLesson').onclick=()=>openLesson(next.id);
 $('#copyCode').onclick=async()=>{const v=$('#codeEditor').value;try{await navigator.clipboard.writeText(v);toast('Code copied')}catch{const ta=$('#codeEditor');ta.select();document.execCommand('copy');toast('Code copied')}};
 $('#downloadCode').onclick=()=>{const r=codeRecord(l);downloadText(`${id}.${r?'py':'txt'}`,$('#codeEditor').value,r?'text/x-python':'text/plain')};
 $('#codeEditor').addEventListener('input',()=>{state.drafts[id]=$('#codeEditor').value;save();$('#codeStatus').textContent='Draft saved locally'});
 if(hasDemo){
  $('#runLab').onclick=()=>runLab(l);
  $('#resetSample').onclick=()=>{$('#labInput').value=l.sample||'';$('#labEncoded').textContent='Run the lab to see output.';$('#labDecoded').textContent='Step notes appear here.'};
  runLab(l,true);
 }
 renderTree();save();
 if(location.hash!==`#${id}`)history.replaceState(null,'',`#${id}`);
}

function renderHome(){
 state.page='home';
 $('#mainView').innerHTML=`<div class="home-hero"><div class="eyebrow">AZ · ENGINEERING TOOLBOOK</div><h1>Understand number theory from the Euclidean algorithm to lattice reduction.</h1><p>A beginner friendly course covering integer arithmetic, modular arithmetic, primality testing, factorization, discrete logarithms, modular roots, fast arithmetic, prime counting and lattice algorithms. Every lesson has a plain explanation and most have a runnable lab.</p><div class="header-actions" style="margin:0"><button class="btn primary" id="startFirst">Start at the beginning</button><button class="btn" id="resumeLesson">Continue lesson</button></div></div>
<div class="stats"><div class="stat"><strong>${CHAPTERS.length}</strong><span>chapters</span></div><div class="stat"><strong>${LESSONS.length}</strong><span>lessons</span></div><div class="stat"><strong>${LESSONS.filter(l=>l.demo&&l.demo!=='none').length}</strong><span>runnable labs</span></div><div class="stat"><strong>1</strong><span>standalone HTML file</span></div></div>
<section class="panel"><div class="panel-head"><h2>Honest scope</h2><p>One app covers the whole curriculum. Real number theory libraries are a separate engineering project.</p></div><div class="body two"><div class="mini"><h3>What runs here</h3><p>Euclidean and extended GCD, binary GCD, modular exponentiation, modular inverse, Chinese remainder theorem, Euler and Fermat theorems, Sieve of Eratosthenes, Miller-Rabin primality test, Pollard rho and Pollard p−1 factorization, baby-step giant-step, Pohlig-Hellman, Tonelli-Shanks, Hensel lifting, Karatsuba multiplication, prime counting and arithmetic functions.</p></div><div class="mini"><h3>What does not run here</h3><p>Production implementations of ECPP, APR-CL, CFRAC, SQUFOF, Williams p+1, Toom-Cook, Schönhage-Strassen, NTT, Meissel-Lehmer, Chudnovsky, Gauss-Legendre, BBP, PSLQ, LLL and BKZ. For real work use GMP, PARI/GP, SageMath, FLINT or another vetted library.</p></div></div></section>
<div class="panel"><div class="panel-head"><h2>Course map</h2><p>Pick a chapter. The path runs from foundations to lattice algorithms.</p></div><div class="body"><div class="chapter-cards">${CHAPTERS.map((c,i)=>`<button class="chapter-card" data-chapter="${c.id}"><span class="num">CHAPTER ${String(i+1).padStart(2,'0')} · ${c.ids.length} LESSONS</span><strong>${esc(c.title.replace(/^\d+\.\s*/,''))}</strong><p>${esc(c.desc)}</p></button>`).join('')}</div></div></div>
<footer class="footer"><span>Az Number Theory Lab</span><span>Single file · no external runtime dependencies</span></footer>`;
 $('#startFirst').onclick=()=>openLesson('divisibility-gcd');
 $('#resumeLesson').onclick=()=>openLesson(state.current&&byId[state.current]?state.current:'divisibility-gcd');
 $('#mainView').querySelectorAll('[data-chapter]').forEach(b=>b.onclick=()=>{const c=CHAPTERS.find(x=>x.id===b.dataset.chapter);if(c)openLesson(c.ids[0])});
}

function renderProgressPage(){
 state.page='progress';
 $('#mainView').innerHTML=`<div class="breadcrumb">Number Theory Lab / Bookmarks & progress</div><header class="header"><div class="eyebrow">LOCAL ONLY</div><h1>Bookmarks and progress</h1><p>Your progress stays in this browser. Export the JSON to move it or keep a backup.</p></header>
<section class="panel"><div class="panel-head"><h2>Completed lessons</h2></div><div class="body">${state.completed.size?`<div class="references">${[...state.completed].map(id=>`<a href="#${id}" data-open="${id}">${esc(byId[id].title)}</a>`).join('')}</div>`:'<p class="muted">No lessons marked complete yet.</p>'}</div></section>
<section class="panel"><div class="panel-head"><h2>Bookmarks</h2></div><div class="body">${state.bookmarks.size?`<div class="references">${[...state.bookmarks].map(id=>`<a href="#${id}" data-open="${id}">${esc(byId[id].title)}</a>`).join('')}</div>`:'<p class="muted">No bookmarks yet.</p>'}</div></section>
<section class="panel"><div class="panel-head"><h2>Progress data</h2></div><div class="body"><div class="header-actions" style="margin:0"><button class="btn primary" id="exportProgress">Export progress JSON</button><button class="btn" id="clearProgress">Clear completion marks</button></div><p class="muted" style="font-size:12.5px;margin-top:14px">Import accepts only known lesson IDs and a supported schema version.</p></div></section>`;
 $('#mainView').querySelectorAll('[data-open]').forEach(a=>a.onclick=e=>{e.preventDefault();openLesson(a.dataset.open)});
 $('#exportProgress').onclick=exportProgress;
 $('#clearProgress').onclick=()=>{if(confirm('Clear all completion marks?')){state.completed.clear();save();renderProgressPage();renderTree();toast('Completion marks cleared')}};
}

function openLesson(id){if(!byId[id])return;renderLesson(id);renderTree();$('#mainView').focus({preventScroll:true});window.scrollTo(0,0)}
function downloadText(name,text,type='text/plain'){const blob=new Blob([text],{type});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),800)}
function exportProgress(){downloadText('az-number-theory-lab-progress.json',JSON.stringify({schemaVersion:1,completed:[...state.completed],bookmarks:[...state.bookmarks],theme:state.theme,current:state.current,drafts:state.drafts},null,2),'application/json');toast('Progress exported')}
function importProgressFile(file){
 if(file.size>2_000_000){toast('Import rejected: file too large');return}
 const r=new FileReader();
 r.onload=()=>{try{
  const d=JSON.parse(r.result);
  if(!d||d.schemaVersion!==1||!Array.isArray(d.completed)||!Array.isArray(d.bookmarks)||typeof d.drafts!=='object')throw Error('bad schema');
  if([...d.completed,...d.bookmarks].some(id=>typeof id!=='string'||!byId[id]))throw Error('unknown id');
  state.completed=new Set(d.completed);
  state.bookmarks=new Set(d.bookmarks);
  state.theme=['system','light','dark'].includes(d.theme)?d.theme:'system';
  state.current=byId[d.current]?d.current:null;
  state.drafts=Object.fromEntries(Object.entries(d.drafts).filter(([k,v])=>byId[k]&&typeof v==='string'&&v.length<100000));
  applyTheme();save();renderTree();
  state.current?openLesson(state.current):renderHome();
  toast('Progress imported');
 }catch(e){toast('Import rejected: invalid progress data')}};
 r.readAsText(file);
}

function bindGlobal(){
 $('#themeSelect').onchange=()=>{state.theme=$('#themeSelect').value;applyTheme();save()};
 $('#printBtn').onclick=()=>print();
 $('#exportBtn').onclick=exportProgress;
 $('#importBtn').onclick=()=>$('#importFile').click();
 $('#importFile').onchange=e=>{if(e.target.files[0])importProgressFile(e.target.files[0]);e.target.value=''};
 $('#searchInput').oninput=renderTree;
 $('#chapterFilter').onchange=renderTree;
 $('#homeLink').onclick=e=>{e.preventDefault();renderHome();history.replaceState(null,'','#home')};
 $('#courseTree').onclick=e=>{const b=e.target.closest('[data-lesson]');if(b)openLesson(b.dataset.lesson)};
 document.querySelectorAll('[data-page="home"]').forEach(b=>b.onclick=renderHome);
 document.querySelectorAll('[data-page="progress"]').forEach(b=>b.onclick=renderProgressPage);
 document.addEventListener('keydown',e=>{
  if(e.key==='/'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)){e.preventDefault();$('#searchInput').focus()}
  if(e.key.toLowerCase()==='t'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)){
   state.theme=state.theme==='dark'?'light':state.theme==='light'?'system':'dark';
   applyTheme();save();
  }
 });
}

function init(){
 load();
 applyTheme();
 CHAPTERS.forEach(c=>{const op=document.createElement('option');op.value=c.id;op.textContent=c.title;$('#chapterFilter').append(op)});
 bindGlobal();
 renderTree();
 const hash=location.hash.replace(/^#/,'');
 if(hash&&byId[hash])renderLesson(hash);
 else if(state.current&&byId[state.current])renderLesson(state.current);
 else renderHome();
 progress();
}
init();
</script></body></html>
