<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark light">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#161313">
<meta name="description" content="aznur / number theory lab — a single-file, privacy-first course on number theory and integer arithmetic with 30 runnable BigInt labs">
<title>aznur / number theory lab</title>
<style>
/* ============ design tokens ============ */
:root{
--font:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
--radius:4px;--radius-sm:3px;--radius-lg:6px;color-scheme:dark;
--bg:#161313;--panel:#1c1818;--panel2:#211d1d;--panel3:#211d1d;
--line:#302c2c;--line2:#454040;--text:#f1eeee;--muted:#a3a0a0;--subtle:#7a7676;
--accent:#f59e0b;--accent-hover:#d97706;--good:#10b981;--warn:#f59e0b;--bad:#f87171;--info:#60a5fa;
--lab-bg:#141110;--lab-deep:#0f0d0b;--lab-toolbar:#151210;--lab-border:#2a2620;
--lab-text:#f5f5f4;--lab-muted:#a8a29e;--lab-amber:#fbbf24;
}
:root[data-theme=light]{
color-scheme:light;
--bg:#fdfcfc;--panel:#faf8f7;--panel2:#f4f0ef;--panel3:#f4f0ef;
--line:#dcd9d9;--line2:#c9c4c4;--text:#201d1d;--muted:#5c5858;--subtle:#78716c;
--accent:#b45309;--accent-hover:#92400e;--good:#047857;--warn:#b45309;--bad:#b91c1c;--info:#2563eb;
--lab-toolbar:#1a1613;--lab-amber:#f59e0b;
}
/* ============ base ============ */
*{box-sizing:border-box}html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:14px/1.55 var(--font);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;font-family:var(--font)}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:var(--radius-sm)}
a{color:var(--accent);text-decoration:none}a:hover{color:var(--accent-hover);text-decoration:underline}
h1,h2,h3,h4{font-weight:600;letter-spacing:-.01em}
.muted{color:var(--muted)}.mono,code,pre,textarea{font-family:var(--font)}
::selection{background:rgba(245,158,11,.28)}
/* ============ scrollbars ============ */
*{scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:6px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:var(--accent)}
.lab-output::-webkit-scrollbar-thumb,.code-editor::-webkit-scrollbar-thumb,.pseudo::-webkit-scrollbar-thumb{background:var(--lab-border);border-color:var(--lab-bg)}
.lab-output::-webkit-scrollbar-thumb:hover,.code-editor::-webkit-scrollbar-thumb:hover{background:var(--lab-amber)}
/* ============ topbar ============ */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:16px;height:56px;padding:0 20px;background:var(--bg);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:6px;color:var(--text);min-width:0;font-size:12.5px}
.brand:hover{text-decoration:none}
.brand strong{font-weight:700;font-size:12.5px;background:linear-gradient(90deg,var(--accent),#fbbf24);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand-slash{color:var(--subtle)}.brand-title{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-meta{flex:1;min-width:0;color:var(--subtle);font-size:10.5px;letter-spacing:.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top-actions{display:flex;align-items:center;gap:6px;flex:none}
.top-actions label{font-size:10px;color:var(--subtle);text-transform:uppercase;letter-spacing:.1em}
/* ============ controls ============ */
select,.btn{border:1px solid var(--line2);background:var(--panel3);color:var(--text);border-radius:var(--radius);padding:6px 10px;font-size:11.5px;line-height:1.3}
.btn{font-weight:500;white-space:nowrap;transition:border-color .12s,color .12s,background .12s}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);color:#161313;border-color:var(--accent)}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover);color:#161313}
:root[data-theme=light] .btn.primary,:root[data-theme=light] .btn.primary:hover{color:#fdfcfc}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.busy::after{content:"";display:inline-block;width:9px;height:9px;margin-left:7px;vertical-align:-1px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.seed{width:76px;border:1px solid var(--line2);background:var(--panel3);color:var(--text);border-radius:var(--radius);padding:5px 8px;font-size:11.5px}
/* ============ layout ============ */
.layout{display:grid;grid-template-columns:256px minmax(0,1fr);max-width:1440px;margin:0 auto;min-height:calc(100vh - 56px)}
.sidebar{position:sticky;top:56px;height:calc(100vh - 56px);overflow:auto;border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;min-width:0}
.side-title{display:flex;justify-content:space-between;align-items:center;padding:0 4px 10px;color:var(--subtle);font-size:9px;font-weight:600;letter-spacing:.14em;text-transform:uppercase}
.pill,.tag{border:1px solid var(--line2);border-radius:var(--radius-sm);padding:2px 6px;font-size:9.5px;color:var(--muted);white-space:nowrap;font-weight:500;letter-spacing:.02em}
.tag.good{color:var(--good);border-color:color-mix(in srgb,var(--good) 40%,var(--line2))}
.tag.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,var(--line2))}
.tag.info{color:var(--info);border-color:color-mix(in srgb,var(--info) 40%,var(--line2))}
.search{display:flex;gap:6px;align-items:center;height:32px;padding:0 8px;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel3);margin-bottom:10px;color:var(--subtle);font-size:11px}
.search:focus-within{border-color:var(--accent)}
.search input{width:100%;min-width:0;background:transparent;border:0;outline:0;color:var(--text);font-size:11.5px;padding:0}
.search input::placeholder{color:var(--subtle)}
.search kbd{border:1px solid var(--line);border-radius:var(--radius-sm);padding:0 5px;font-size:9.5px;color:var(--subtle);background:var(--bg)}
.filter{display:block;color:var(--subtle);font-size:10px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:10px;font-weight:500}
.filter select{display:block;width:100%;margin-top:5px;padding:6px 8px;font-size:11px;text-transform:none;letter-spacing:0}
.check{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:10.5px;margin-bottom:12px;cursor:pointer}
.check input{accent-color:var(--accent)}
.tree{display:flex;flex-direction:column;gap:12px;min-width:0}
.group-label{display:flex;justify-content:space-between;color:var(--subtle);font-size:9px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding:4px 6px}
.group-label .gdone{color:var(--good)}
.link{display:flex;gap:8px;align-items:center;width:100%;text-align:left;background:transparent;border:1px solid transparent;color:var(--muted);padding:6px 8px;border-radius:var(--radius);min-height:30px;transition:background .1s,color .1s,border-color .1s}
.link .num{font-size:9.5px;color:var(--subtle);width:20px;flex:none}
.link .name{flex:1;min-width:0;font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.link .done{color:var(--good);font-size:11px}.link .bm{color:var(--accent);font-size:10px}
.link:hover{background:var(--panel2);color:var(--text)}
.link.active{background:var(--panel2);border-color:var(--line2);color:var(--text);box-shadow:inset 2px 0 0 var(--accent)}
.link.active .name{font-weight:500}
.side-foot{margin-top:auto;padding-top:14px;border-top:1px solid var(--line)}
.progress-row{display:flex;justify-content:space-between;color:var(--subtle);font-size:10px;letter-spacing:.06em;margin-bottom:6px;text-transform:uppercase}
.progress-row strong{color:var(--text);font-weight:500}
.progress{height:4px;background:var(--panel3);border-radius:2px;overflow:hidden}
.progress>div{height:100%;width:0;background:linear-gradient(90deg,var(--accent),#fbbf24);transition:width .25s ease}
.progress.full>div{background:var(--good)}
.side-actions{display:flex;gap:6px;margin-top:10px}
.side-actions .btn{flex:1;padding:5px 6px;font-size:10.5px}
/* ============ main ============ */
main{max-width:900px;width:100%;min-width:0;margin:0 auto;padding:24px 28px 40px}
main:focus{outline:none}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
main>*{animation:rise .35s cubic-bezier(.2,.7,.3,1) both}
main>*:nth-child(2){animation-delay:.03s}main>*:nth-child(3){animation-delay:.06s}
main>*:nth-child(4){animation-delay:.09s}main>*:nth-child(5){animation-delay:.12s}
main>*:nth-child(n+6){animation-delay:.15s}
.breadcrumb{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--subtle);margin-bottom:14px}
.header{padding:2px 0 20px;border-bottom:1px solid var(--line);margin-bottom:18px}
.eyebrow{font-size:9.5px;text-transform:uppercase;letter-spacing:.14em;font-weight:600;color:var(--accent);margin-bottom:8px}
.header h1{font-size:22px;line-height:1.2;margin:0 0 10px;font-weight:600}
.header p{font-size:13px;color:var(--muted);margin:0 0 12px;max-width:720px;line-height:1.6}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.header-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
/* ============ panels ============ */
.panel{border:1px solid var(--line);background:var(--panel);border-radius:var(--radius);margin-bottom:14px;overflow:hidden}
.panel-head{padding:14px 16px 0}
.panel-head h2{font-size:12.5px;margin:0 0 3px;font-weight:600}
.panel-head p{font-size:11.5px;color:var(--muted);margin:0;line-height:1.55}
.body{padding:12px 16px 16px}
.idea{display:grid;grid-template-columns:minmax(0,1fr) 200px;gap:18px}
.idea p{font-size:12.5px;color:var(--muted);margin:0 0 11px;line-height:1.6}
.mental{background:var(--panel3);border:1px solid var(--line);border-radius:var(--radius);padding:11px}
.mental small{display:block;color:var(--subtle);font-size:9px;letter-spacing:.12em;text-transform:uppercase;font-weight:600}
.mental strong{display:block;margin:5px 0;font-size:12px;color:var(--text);font-weight:600;line-height:1.4}
.mental p{font-size:11px;color:var(--muted);margin:0;line-height:1.55}
.takeaway{padding:10px 12px;border:1px solid var(--line2);background:var(--panel3);border-radius:var(--radius);color:var(--text);font-size:12px;line-height:1.6}
.takeaway strong{color:var(--accent);font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mini{background:var(--panel3);border:1px solid var(--line);border-radius:var(--radius);padding:11px 12px}
.mini h3{font-size:11.5px;margin:0 0 6px;font-weight:600}
.mini p{font-size:11.5px;color:var(--muted);margin:0;line-height:1.6}
.steps{counter-reset:s;list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:7px}
.steps li{counter-increment:s;display:flex;gap:9px;font-size:11.5px;color:var(--muted);line-height:1.55}
.steps li:before{content:counter(s);flex:none;width:20px;height:20px;display:grid;place-items:center;border:1px solid var(--line2);border-radius:var(--radius-sm);background:var(--panel3);color:var(--accent);font-size:10px;margin-top:1px}
.pseudo{white-space:pre-wrap;overflow:auto;background:var(--lab-bg);color:var(--lab-text);border:1px solid var(--lab-border);border-radius:var(--radius);padding:12px 14px;font:11.5px/1.7 var(--font);margin:0}
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:var(--radius);margin-top:14px}
table{border-collapse:collapse;width:100%;font-size:11.5px}
th,td{border-bottom:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
tr:last-child td{border-bottom:0}
th{font-size:9.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--subtle);font-weight:600;background:var(--panel3)}
td{color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{padding:10px 11px;background:var(--panel3);border:1px solid var(--line);border-radius:var(--radius);min-width:0}
.tile span{display:block;font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--subtle);font-weight:600;margin-bottom:4px}
.tile strong{display:block;color:var(--text);font-size:12.5px;font-weight:600;overflow-wrap:anywhere}
.tile small{display:block;font-size:10.5px;color:var(--muted);margin-top:3px;line-height:1.5}
.notice{padding:10px 12px;background:var(--panel3);border:1px solid color-mix(in srgb,var(--warn) 32%,var(--line));border-radius:var(--radius);font-size:11.5px;color:var(--muted);line-height:1.6}
.notice strong{color:var(--warn);font-weight:600}
.notice.info{border-color:color-mix(in srgb,var(--info) 35%,var(--line))}
.notice.info strong{color:var(--info)}
/* ============ visual lab (always dark) ============ */
.lab-top{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.lab-seed{display:flex;align-items:center;gap:6px}
.lab-seed label{font-size:10px;color:var(--subtle);letter-spacing:.08em;text-transform:uppercase;font-weight:600}
.lab-actions{display:flex;gap:6px;flex-wrap:wrap}
.lab-input{display:block;width:100%;min-height:90px;resize:vertical;background:var(--lab-bg);border:1px solid var(--lab-border);border-radius:var(--radius);padding:10px 12px;color:var(--lab-text);font:11.5px/1.6 var(--font);margin:6px 0 10px}
.lab-input:focus-visible{outline-color:var(--lab-amber);border-color:var(--lab-amber)}
.lab-plot{background:var(--lab-deep);border:1px solid var(--lab-border);border-radius:var(--radius);padding:10px;margin-top:12px;display:flex;flex-direction:column;gap:8px}
.plot{width:100%;height:auto;display:block}
.lab-output{padding:12px 14px;background:var(--lab-deep);border:1px solid var(--lab-border);border-radius:var(--radius);min-height:80px;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--lab-text);font:11.5px/1.7 var(--font);overflow-x:auto;transition:border-color .5s}
.lab-output.flash{border-color:var(--lab-amber)}
.lab-cols{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:10px;margin-top:12px}
.label{font-size:9px;color:var(--subtle);letter-spacing:.12em;text-transform:uppercase;font-weight:600;margin-bottom:5px}
.lab-status{margin-top:10px;font-size:10px;color:var(--subtle);letter-spacing:.04em;min-height:14px}
.lab-status[data-state=err]{color:var(--bad)}
.lab-status[data-state=ok]{color:var(--good)}
/* ============ code workshop (always dark) ============ */
.code-head{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:9px 12px;background:var(--lab-toolbar);border-bottom:1px solid var(--lab-border)}
.code-head .tag{border-color:var(--lab-border);color:var(--lab-muted);background:transparent}
.code-head .btn{background:transparent;border-color:var(--lab-border);color:var(--lab-text);padding:4px 8px;font-size:10.5px}
.code-head .btn:hover{border-color:var(--lab-amber);color:var(--lab-amber)}
.code-editor{display:block;width:100%;min-height:220px;resize:vertical;border:0;border-radius:0;background:var(--lab-bg);color:var(--lab-text);padding:14px 16px;font:11.5px/1.7 var(--font);outline:0;tab-size:4}
.code-editor:focus-visible{outline:2px solid var(--lab-amber);outline-offset:-2px}
.code-foot{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:8px 12px;color:var(--lab-muted);font-size:10px;border-top:1px solid var(--lab-border);background:var(--lab-toolbar);flex-wrap:wrap}
/* ============ misc ============ */
.practice{border:1px solid var(--line);background:var(--panel3);border-radius:var(--radius);padding:11px 12px}
.practice summary{cursor:pointer;font-size:12px;font-weight:600;list-style:none;display:flex;align-items:flex-start;gap:8px}
.practice summary::-webkit-details-marker{display:none}
.practice summary::before{content:"?";flex:none;width:18px;height:18px;display:grid;place-items:center;border:1px solid var(--line2);border-radius:var(--radius-sm);color:var(--accent);font-size:10px;font-weight:600}
.practice[open] summary::before{content:"…"}
.practice p{font-size:11.5px;color:var(--muted);margin:9px 0 0;line-height:1.65}
.references{display:flex;flex-direction:column;gap:6px}
.references a{font-size:11.5px;overflow-wrap:anywhere;line-height:1.55}
.home-hero{position:relative;overflow:hidden;padding:26px 26px 24px;background:radial-gradient(620px 320px at 88% -30%,rgba(245,158,11,.09),transparent 60%),var(--panel);border:1px solid var(--line);border-radius:var(--radius-lg);margin-bottom:14px}
:root[data-theme=light] .home-hero{background:radial-gradient(620px 320px at 88% -30%,rgba(180,83,9,.07),transparent 60%),var(--panel)}
.hero-grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:22px;align-items:center}
.home-hero h1{font-size:clamp(20px,2.4vw,26px);line-height:1.25;letter-spacing:-.015em;margin:6px 0 12px;font-weight:600}
.home-hero p{color:var(--muted);font-size:12.5px;max-width:680px;margin:0 0 16px;line-height:1.65}
.hero-visual{background:var(--lab-deep);border:1px solid var(--lab-border);border-radius:var(--radius);padding:8px}
.hero-visual .plot{width:100%}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:14px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:11px 12px;min-width:0}
.stat strong{display:block;font-size:18px;color:var(--text);font-weight:600;line-height:1.1}
.stat span{display:block;font-size:9.5px;color:var(--subtle);margin-top:4px;letter-spacing:.08em;text-transform:uppercase;font-weight:500}
.chapter-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.chapter-card{padding:12px 13px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);color:var(--text);transition:border-color .12s,background .12s;min-width:0}
.chapter-card:hover{border-color:var(--accent);background:var(--panel2)}
.chapter-card .num{font-size:9px;color:var(--accent);letter-spacing:.1em;font-weight:600;text-transform:uppercase}
.chapter-card strong{display:block;font-size:12px;margin:4px 0;font-weight:600;line-height:1.4}
.chapter-card p{font-size:11px;color:var(--muted);margin:0 0 8px;line-height:1.55}
.mini-progress{height:3px;background:var(--panel3);border-radius:2px;overflow:hidden}
.mini-progress>div{height:100%;background:var(--accent)}
.mini-progress.full>div{background:var(--good)}
.cc-meta{display:flex;justify-content:space-between;font-size:9px;color:var(--subtle);letter-spacing:.06em;text-transform:uppercase;margin-top:5px}
.scope-chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.chip{border:1px solid var(--line2);background:transparent;color:var(--muted);border-radius:var(--radius-sm);padding:3px 8px;font-size:10px;transition:border-color .12s,color .12s}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip.warn{border-style:dashed}
.toast{position:fixed;z-index:99;bottom:18px;left:50%;transform:translate(-50%,10px);opacity:0;pointer-events:none;background:var(--panel);border:1px solid var(--line2);border-left:3px solid var(--accent);border-radius:var(--radius);padding:9px 14px;font-size:11.5px;color:var(--text);box-shadow:0 4px 20px rgba(0,0,0,.25);transition:opacity .14s,transform .14s;max-width:calc(100vw - 32px);display:flex;align-items:center;gap:10px}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast .btn{padding:3px 9px;font-size:10.5px}
.footer{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;padding:12px 2px 6px;font-size:10px;color:var(--subtle);border-top:1px solid var(--line);margin-top:20px}
.footer .btn{padding:5px 8px;font-size:10.5px}
/* ============ modal ============ */
.modal-overlay{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.55);display:grid;place-items:center;padding:16px}
.modal-overlay[hidden]{display:none}
.modal{background:var(--panel);border:1px solid var(--line2);border-radius:var(--radius-lg);max-width:440px;width:100%;padding:18px}
.modal h2{font-size:13px;margin:0 0 12px}
.modal p{font-size:12px;color:var(--muted);line-height:1.6;margin:0 0 14px}
.kbd-row{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid var(--line);font-size:11.5px;color:var(--muted)}
.kbd-row:last-of-type{border-bottom:0}

{id:"miller-rabin",title:"Miller-Rabin primality test",level:3,kind:"Probabilistic test",status:"Runnable teaching lab",
summary:"Miller-Rabin tests primality by writing n−1 = 2^s × d and checking whether a^d ≡ 1 or a^(2^r × d) ≡ −1 for a base a.",
mental:"A witness that certifies compositeness",
mentalText:"A base a is a witness that n is composite if a^d is not 1 and no power of 2 in the chain gives −1. If a is not a witness, n is probably prime.",
input:"One integer n ≥ 2 (up to 2048 bits).",
output:"The n−1 = 2^s·d decomposition, a per-base pass/witness table, and whether the verdict is deterministic for this size.",
complexity:["O(k log n) modular multiplications","O(1) working state","Deterministic below 3.3×10²⁴ with 12 bases"],
trace:[["1","Split n−1 = 2^s · d, d odd","The squaring chain has exactly s links"],["2","Compute x = a^d mod n","The start of the chain"],["3","Square up to s−1 times, look for −1","Reaching −1 means this base passes"],["4","No 1 and no −1 → witness","A rigorous proof that n is composite"]],
steps:["Write n−1 = 2^s × d with d odd.","Pick a base a in [2, n−2].","Compute x = a^d mod n.","If x = 1 or x = n−1, this base passes.","Otherwise square x up to s−1 times. If any is n−1, it passes.","Otherwise a is a witness that n is composite."],
pseudo:`Miller-Rabin(n, a):
d = n - 1; s = 0
while d is even: d //= 2; s += 1
x = modexp(a, d, n)
if x == 1 or x == n - 1: return Probably prime
for _ in range(s - 1):
x = (x * x) mod n
if x == n - 1: return Probably prime
return Composite

pseudo:`Solovay-Strassen(n, a):
if gcd(a, n) > 1: return Composite
j = jacobi(a, n)
x = modexp(a, (n-1)//2, n)
if j == 0 or x != j mod n: return Composite

Jacobi(a, n) by reciprocity, n odd positive:
a = a mod n; result = 1
while a != 0:
while a even:
a /= 2
if n mod 8 in {3,5}: result = -result
swap a, n
if a ≡ 3 (mod 4) and n ≡ 3 (mod 4): result = -result
a = a mod n
return result if n == 1 else 0

summary:"Pollard rho finds a factor of a composite number by looking for a cycle in a sequence modulo the (unknown) factor. It is fast for small factors.",
mental:"A random walk that eventually collides with itself",
mentalText:"You generate a sequence of numbers modulo n. If n has a small factor p, the sequence modulo p cycles much faster than modulo n. The collision reveals p.",
input:"A composite n (≤ 1024 bits), optionally the polynomial constant c.",
output:"A nontrivial factor, the iteration count, primality of both parts, and the measured tail μ and cycle λ of the walk modulo the factor.",
complexity:["Expected O(√p) for the smallest factor p","O(1) — Floyd keeps two states","Seeded PRNG for reproducibility, not cryptography"],
trace:[["1","Iterate f(x) = x² + c mod n","Pseudo-random modulo every factor at once"],["2","Floyd: x once, y twice per step","Finds a collision with constant memory"],["3","gcd(|x − y|, n)","A collision mod p but not mod n exposes p"],["4","d = n → change c and retry","Both factors collided together — useless"]],
steps:["Choose a polynomial f(x) = x² + c mod n.","Start with x = y = x₀.","Iterate x = f(x), y = f(f(y)).","Compute d = gcd(|x − y|, n).","If d is a nontrivial factor, done. If d = n, retry with different c."],
pseudo:`Pollard rho(n):
if n is even: return 2
c = random(1, n-1); x = y = 2; d = 1
while d == 1:
x = (x*x + c) mod n
y = (y*y + c) mod n
y = (y*y + c) mod n
d = gcd(|x - y|, n)
if d == n: retry with different c
return d
Expected time: O(sqrt(p)) for the smallest factor p`,

summary:"Pollard p−1 finds a factor p when p−1 is smooth. It computes a^M mod n where M is a multiple of many small primes, and takes the GCD.",

mentalText:"If p−1 has only small prime factors, then a^M ≡ 1 mod p for a suitable M. So gcd(a^M − 1, n) gives p.",

output:"The factor and the prime q where it appeared, the factorization of p−1, and the gcd trace.",

trace:[["1","Pick bound B, list primes ≤ B","B is the smoothness hypothesis"],["2","Raise the accumulator to each prime power ≤ B","Builds M incrementally"],["3","gcd(a − 1, n) after every prime power","Catches one factor before both become smooth"],["4","d = n → back off; nothing → raise B","The two failure modes, distinguished"]],

pseudo:`Pollard p-1(n, B):

retry with larger B or different base

pseudo:`Continued fraction of sqrt(n):
m_0 = 0, d_0 = 1, a_0 = floor(sqrt(n))
m_{k+1} = d_k a_k - m_k
d_{k+1} = (n - m_{k+1}^2) / d_k
a_{k+1} = floor((a_0 + m_{k+1}) / d_{k+1})
Convergents: p_k = a_k p_{k-1} + p_{k-2}
q_k = a_k q_{k-1} + q_{k-2}

M = product of prime powers up to B

{id:"bsgs",title:"Baby-step giant-step",level:4,kind:"Discrete logarithm",status:"Runnable teaching lab",
summary:"BSGS solves g^x ≡ h (mod p) in O(√p) time and space by writing x = i × m + j and precomputing a table of baby steps.",
mental:"Meeting in the middle of a long walk",
mentalText:"Instead of searching all exponents, split the search in half. Build a table of the first half and match against the second half.",
input:"Three integers g h p with p prime; √(p−1) ≤ 250000 table entries.",
output:"x with verification, the order of g, the giant-step factor, and an honest NO SOLUTION when h ∉ ⟨g⟩.",
complexity:["O(√N) time","O(√N) table entries — the fatal cost","Deterministic: no solution means no solution"],
trace:[["1","m = ceil(√N), store g^j for j < m","Keep the smallest j per value"],["2","factor = g^(−m) mod p","NOT g^(−1) — the classic silent bug"],["3","Walk h·factor^i, look up the table","A match gives x = i·m + j"],["4","Verify g^x ≡ h","Also proves membership in ⟨g⟩"]],
steps:["Choose m = ceil(√N) where N is the group order.","Baby steps: store g^j for j = 0 … m−1.","Compute the giant-step factor g^(−m).","Giant steps: test h · (g^(−m))^i for i = 0 … m−1.","On a match, x = i·m + j."],
pseudo:`BSGS(g, h, p):
N = order of the group (p-1 for a primitive root)
m = ceil(sqrt(N))
table = {}
e = 1
for j in range(m):
if e not in table: table[e] = j
e = (e * g) mod p
factor = inverse(g^m mod p, p)      # g^(-m), NOT g^(-1)
e = h
for i in range(m):
if e in table: return i * m + table[e]
e = (e * factor) mod p
return no solution
Time and space: O(sqrt(N))`,

answer:"About 10^6 entries, which is manageable. For p ≈ 10^18 it needs 10^9 entries, which is too much.",

pseudo:`Pollard rho for logs:
step(Y, a, b):
if Y ≡ 0 (mod 3): return (Y*g, a+1, b)
if Y ≡ 1 (mod 3): return (Y*h, a,   b+1)
else:             return (Y*Y, 2a,  2b)
Floyd: X = step(X); Y = step(step(Y))
On X == Y:
r = (a_Y - a_X) mod N
s = (b_X - b_Y) mod N
if s == 0: restart
if gcd(s, N) == 1: x = r * s^(-1) mod N

summary:"Pohlig-Hellman reduces a discrete logarithm in a group of order N to discrete logs in subgroups of prime order. It works well when N is smooth.",

Factor N = q_1^e_1 × ... × q_k^e_k

summary:"Tonelli-Shanks computes square roots modulo a prime p. It is the standard algorithm for this problem.",
mental:"Finding the number that squares to a given value",
mentalText:"Given a and p, find x such that x² ≡ a (mod p). If no such x exists, a is a quadratic non-residue.",
input:"Two integers n p with p prime (p = 2 handled separately).",
output:"Both roots r and p−r with verification, the Legendre symbol, and the full quadratic-residue grid for small p.",
complexity:["O(log² p) worst case, O(log p) when p ≡ 3 mod 4","O(1) working state","Euler's criterion decides existence exactly"],
trace:[["1","Handle n ≡ 0 and p = 2","The degenerate cases that break naive loops"],["2","Euler test n^((p−1)/2)","1 → residue, −1 → no root exists"],["3","p ≡ 3 mod 4: root = n^((p+1)/4)","The easy half of all primes"],["4","Otherwise iterate the 2-Sylow correction","t walks to 1, R walks to the root"]],
steps:["Handle a ≡ 0 and p = 2 separately.","Check Euler's criterion a^((p−1)/2) ≡ 1.","If p ≡ 3 (mod 4) the root is a^((p+1)/4).","Otherwise write p−1 = q·2^s, find a non-residue z, and iterate."],
pseudo:`Tonelli-Shanks(n, p):
if n mod p == 0: return 0
if p == 2: return n mod 2
if n^((p-1)/2) != 1 (mod p): no root
if p ≡ 3 (mod 4): return n^((p+1)/4) mod p
write p - 1 = q 2^s with q odd
find z with z^((p-1)/2) = -1
M = s, c = z^q, t = n^q, R = n^((q+1)/2)
while t != 1:
find least i with t^(2^i) == 1
b = c^(2^(M-i-1))
M = i, c = b^2, t = t b^2, R = R b
return R`,

{id:"karatsuba",title:"Karatsuba multiplication",level:3,kind:"Fast arithmetic",status:"Runnable teaching lab",
summary:"Karatsuba reduces the number of single-digit multiplications from 4 to 3 when multiplying two 2-digit numbers recursively, giving O(n^1.585) instead of O(n²).",
mental:"Trading multiplications for additions",
mentalText:"Multiplying two large numbers is expensive. Karatsuba does three half-size multiplications instead of four, at the cost of more additions.",
input:"Two non-negative integers (up to 2048 digits each).",
output:"The exact product, recursive call and leaf counts versus schoolbook digit products, verified against the built-in product.",
complexity:["O(n^1.585) vs O(n²) schoolbook","O(n) recursion stack","Exact BigInt — doubles would lose precision above 2⁵³"],
trace:[["1","Split both numbers at 10^h","High and low halves"],["2","Three products: ac, bd, (a+b)(c+d)","The middle one merges both cross terms"],["3","Recover ad+bc by subtraction","Two extra additions buy one fewer multiply"],["4","Recurse; verify against x·y","4^k work becomes 3^k"]],
steps:["Split each number into high and low halves.","Compute three products: high×high, low×low, (high+low)×(high+low).","Combine: ac·B^(2h) + ((a+b)(c+d) − ac − bd)·B^h + bd.","Recurse on the half-size multiplications."],
pseudo:`Karatsuba(x, y):
if x < B or y < B: return x * y
h = max(digits(x), digits(y)) // 2
a, b = divmod(x, 10^h)
c, d = divmod(y, 10^h)
ac = Karatsuba(a, c)
bd = Karatsuba(b, d)
ad_plus_bc = Karatsuba(a + b, c + d) - ac - bd
return ac * 10^(2h) + ad_plus_bc * 10^h + bd
Time: O(n^1.585)`,

"williams":`from math import gcd, isqrt

def lucas_v(A, k, n):
    """V_k of the Lucas sequence V_0=2, V_1=A, V_{k+1}=A V_k - V_{k-1}."""
    v0, v1 = 2 % n, A % n
    for bit in bin(k)[2:]:
        if bit == "0":
            v1 = (v0 * v1 - A) % n
            v0 = (v0 * v0 - 2) % n
        else:
            v0 = (v0 * v1 - A) % n
            v1 = (v1 * v1 - 2) % n
    return v0

def primes_up_to(b):
    s = bytearray([1]) * (b + 1)
    s[0:2] = b"\\x00\\x00"
    for p in range(2, int(b**0.5) + 1):
        if s[p]:
            s[p*p::p] = bytearray(len(s[p*p::p]))
    return [i for i in range(2, b + 1) if s[i]]

def williams_pp1(n, B=20, A=3):
    # Composition: V_{m*k}(A) = V_m(V_k(A)) for Q = 1,
    # so one short ladder per prime power suffices.
    cur = A % n                       # V_1
    for q in primes_up_to(B):
        pe = q
        while pe * q <= B:
            pe *= q
        cur = lucas_v(cur, pe, n)     # V_M with M *= pe
        d = gcd(cur - 2, n)
        if 1 < d < n:
            return d
        if d == n:
            return None
    return None

def cf_sqrt(n, terms=8):
    a0 = isqrt(n)
    m, d, a = 0, 1, a0
    p0, p1, q0, q1 = a0, 1, 1, 0
    out = [(p0, q0, p0*p0 - n*q0*q0)]
    for _ in range(terms):
        m = d * a - m
        d = (n - m*m) // d
        a = (a0 + m) // d
        p2, q2 = a*p0 + p1, a*q0 + q1
        out.append((p2, q2, p2*p2 - n*q2*q2))
        p1, p0, q1, q0 = p0, p2, q0, q2
    return out

print(cf_sqrt(23, 5))

"pohlig-hellman":`from math import isqrt

def bsgs_order(g, h, p, q):
    """Discrete log inside the subgroup of order q."""
    m = isqrt(q) + 1
    table = {}
    e = 1
    for j in range(m):
        table.setdefault(e, j)
        e = e * g % p
    factor = pow(pow(g, m, p), -1, p)
    e = h
    for i in range(m):
        if e in table:
            return i * m + table[e]
        e = e * factor % p
    return None

def pohlig_hellman(g, h, p):
    N = p - 1
    factors = {}
    n, d = N, 2
    while d * d <= n:
        while n % d == 0:
            factors[d] = factors.get(d, 0) + 1
            n //= d
        d += 1
    if n > 1:
        factors[n] = factors.get(n, 0) + 1
    residues, moduli = [], []
    for q, e in factors.items():
        gamma = pow(g, N // q, p)
        xq = 0
        for j in range(e):
            hj = pow(h * pow(g, -xq, p), N // q**(j + 1), p)
            dj = bsgs_order(gamma, hj, p, q)
            if dj is None:
                return None
            xq += dj * q**j
        residues.append(xq)
        moduli.append(q**e)
    M = 1
    for m in moduli:
        M *= m
    x = 0
    for a, m in zip(residues, moduli):
        Mi = M // m
        x += a * Mi * pow(Mi, -1, m)
    return x % M

x = pohlig_hellman(5, 17, 23)
print("x =", x, "check:", pow(5, x, 23))

factorization: ${[...f.entries()].map(([p,e])=>`${p}^${e}`).join(' × ')||'1 (n = 1)'}
φ(${n}) = ${phi}      (integers ≤ n coprime to n)
σ(${n}) = ${sigma}     (sum of divisors)
τ(${n}) = ${tau}      (number of divisors)
μ(${n}) = ${mu}       (Möbius)
divisors (${divisors.length}): ${divisors.slice(0,40).join(', ')}${divisors.length>40?' …':''}
σ from the divisor list: ${divisors.reduce((s,d)=>s+d,0n)}   ${divisors.reduce((s,d)=>s+d,0n)===sigma?'✓':'✗'}
Σ_{d|n} μ(d) = ${muSum}   expected ${n===1n?1:0}   ${muSum===(n===1n?1n:0n)?'✓':'✗'}
(only the ${1<<ps.length} squarefree divisors contribute — one per prime subset)
${perfect?'n is a PERFECT number (σ = 2n).':''}
${mu===0?'μ = 0 because n is not squarefree.':'n is squarefree, so μ = (−1)^(number of prime factors).'}`,
decoded:`All four functions are multiplicative: for coprime m and n, f(mn) = f(m)f(n). That lets you read them straight off the prime factorization instead of enumerating divisors.
Möbius μ is the inverse of the constant function 1 under Dirichlet convolution, which is exactly the identity Σ_{d|n} μ(d) = [n = 1] verified above. Non-squarefree divisors contribute 0, so the sum collapses to Π_{p|n}(1 − 1) — the lab checks it by enumerating the 2^k squarefree subsets. That identity powers Möbius inversion and inclusion–exclusion arguments throughout number theory.
Computing φ or σ for a large n is as hard as factoring n — which is precisely the assumption RSA rests on.`};

function demoChudnovsky(text){
const lines=linesOf(text);
const terms=clampInt(lines[0],4,1,LIMITS.terms);
const digits=clampInt(lines[1],70,20,LIMITS.digits);
const scale=10n**BigInt(digits+10);
function fact(k){let r=1n;for(let i=2n;i<=BigInt(k);i++)r*=i;return r;}
let S=0n;
const contrib=[];
for(let k=0;k<terms;k++){
const num=fact(6*k)*(13591409n+545140134n*BigInt(k));
const den=fact(3*k)*fact(k)**3n*(640320n**(3n*BigInt(k)));
const term=num*scale/den;
S+=(k%2?-term:term);
contrib.push(term);
}
const root=isqrtB(10005n*scale*scale);
const piScaled=426880n*root*scale/S;
const s=piScaled.toString();
const shown=s[0]+'.'+s.slice(1,1+digits);
const target='3'+PI100;
const match=digitsMatch(s,target);
const logs=contrib.map(v=>v===0n?-(digits+10):Math.log10(Number(v)/Number(scale)));
return{
html:barsPlot(logs,contrib.map((_,i)=>'k'+i),{signed:true,ylab:'log₁₀(term / scale)',label:'Term magnitudes shrink by ~10⁻¹⁴ each step'}),
encoded:`terms = ${terms}, working precision = ${digits+10} digits
π ≈ ${shown}
matching significant digits vs π: ${match}${match>=target.length?' (limited by the reference constant)':''}
digits gained per term ≈ ${terms>1?fmtNum(match/terms,2):'—'}
series: π = 426880·√10005 / S
S = Σ (−1)^k (6k)!(13591409 + 545140134k) / ((3k)!(k!)³ 640320^(3k))
exact integer numerator/denominator per term, then one
BigInt division at working precision.
${contrib.some(v=>v===0n)?'note: terms below the working scale truncate to 0 — they cannot add digits at this precision.':''}`,
decoded:`Each Chudnovsky term is roughly 10^14 times smaller than the previous one, so the series adds about 14.18 correct decimal digits per term. Four terms already give more than 50 digits.
The 426880·√10005 form avoids the fractional power 640320^(3/2) in the classical statement, so everything except the final square root stays in exact integer arithmetic.
Record computations use binary splitting to evaluate the sum as a single rational number, which parallelizes and avoids repeated big divisions. This lab evaluates term by term for clarity.`};
}
function demoGaussLegendre(text){
const lines=linesOf(text);
const iters=clampInt(lines[0],4,1,8);
const digits=clampInt(lines[1],70,20,LIMITS.digits);
const scale=10n**BigInt(digits+10);
let a=scale,b=isqrtB(scale*scale/2n),t=scale/4n,p=1n;
const target='3'+PI100;
const rows=[],matches=[];
for(let i=0;i<iters;i++){
const an=(a+b)/2n;
const bn=isqrtB(a*b);
const diff=a-an;
t=t-p*diff*diff/scale;
p*=2n;
a=an;b=bn;
const est=(a+b)*(a+b)*scale/(4n*t);
const s=est.toString();
const m=digitsMatch(s,target);
matches.push(m);
rows.push(`  iteration ${i+1}: ${m} matching significant digits   π ≈ ${s[0]}.${s.slice(1,1+Math.min(digits,20))}…`);
}
return{
html:linePlot([{x:matches.map((_,i)=>i+1),y:matches,name:'correct digits'}],{xlab:'iteration',ylab:'digits',label:'Quadratic convergence'}),
encoded:`iterations = ${iters}, working precision = ${digits+10} digits
${rows.join('\n')}
digit growth: ${matches.join(' → ')}
ratio between successive counts: ${matches.slice(1).map((v,i)=>fmtNum(v/Math.max(1,matches[i]),2)).join(', ')}
a₀ = 1, b₀ = 1/√2, t₀ = 1/4, p₀ = 1
aₙ₊₁ = (aₙ+bₙ)/2,  bₙ₊₁ = √(aₙbₙ)
tₙ₊₁ = tₙ − pₙ(aₙ − aₙ₊₁)²,  pₙ₊₁ = 2pₙ
π ≈ (a+b)² / (4t)`,
decoded:`The arithmetic and geometric means converge to a common limit (the AGM), and the convergence is quadratic — the number of correct digits roughly doubles each iteration: about 2, 8, 18, 40, 80.
The correction term t must be updated with the doubling weight pₙ; forgetting to double p is the classic bug and destroys the estimate.
Every square root here is an exact integer square root of a scaled BigInt, so no floating point is involved. The precision ceiling is the working scale, not the algorithm.`};
}
function demoBbp(text){
const nums=parseBig(text);
const start=clampInt(String(nums[0]),1,1,LIMITS.bbpPos);
const count=clampInt(String(nums[1]??12n),12,1,LIMITS.bbpCount);
function series(j,n){
let s=0;
for(let k=0;k<=n;k++){
const r=8*k+j;
s+=modpowNum(16,n-k,r)/r;   /* r ≤ 8·10⁵, so r² < 2⁵³: exact in doubles */
s-=Math.floor(s);
}
let t=n+1;
for(;;){
const r=8*t+j;
const term=Math.pow(16,n-t)/r;
if(term<1e-17||t>n+60)break;
s+=term;s-=Math.floor(s);t++;
}
return s;
}
const HEX="0123456789ABCDEF";
let out='';
for(let i=0;i<count;i++){
const n=start-1+i;
const x=(4*series(1,n)-2*series(4,n)-series(5,n)-series(6,n))%1;
out+=HEX[Math.floor(((x+1)%1)*16)];
}
const known="243F6A8885A308D3";
let verified='not in the verified range';
if(start===1)verified=out.slice(0,Math.min(count,known.length))===known.slice(0,Math.min(count,known.length))?'matches the known expansion ✓':'MISMATCH ✗';
return{
html:barsPlot(out.split('').map(c=>parseInt(c,16)),out.split(''),{ylab:'hex value',label:'Extracted hexadecimal digits'}),
encoded:`π = 3.${out}…  (hexadecimal)
positions ${start} … ${start+count-1} after the hexadecimal point
known first digits: 243F6A8885A308D3
verification: ${verified}
BBP: π = Σ 1/16^k ( 4/(8k+1) − 2/(8k+4) − 1/(8k+5) − 1/(8k+6) )
For position n the sum splits at k = n:
k ≤ n : 16^(n−k) mod (8k+j), by modular exponentiation
k > n : a rapidly shrinking tail`,
decoded:`The BBP formula lets you compute the n-th hexadecimal digit of π without computing any earlier digit. The trick is that 16^(n−k) mod (8k+j) can be evaluated by modular exponentiation, keeping only fractional parts.
No analogous formula is known for base 10 — that remains an open problem.
Precision caveat: this implementation accumulates in double precision (the modular products themselves are exact, since (8k+j)² stays below 2⁵³ at these positions), so digits far out — roughly beyond position 10⁷, and sooner with unlucky rounding — become unreliable. Arbitrary-precision floating point is needed for record-depth extraction.`};
}
function demoLll(text){
const lines=linesOf(text);
let deltaNum=0.75;
const rowsIn=[];
for(const l of lines){
const toks=tokensOf(l);
if(toks.length===1&&l.includes('.')){deltaNum=clampNum(toks[0],0.75,0.26,0.99);continue;}
rowsIn.push(toks.map(big));
}
if(rowsIn.length<2)throw Error('Enter at least two basis vectors, one per line.');
const dim=rowsIn[0].length;
if(dim<2||dim>LIMITS.lllDim)throw Error(`Dimension must be 2–${LIMITS.lllDim}.`);
if(rowsIn.some(r=>r.length!==dim))throw Error('All basis vectors must have the same dimension.');
if(rowsIn.length>dim)throw Error('A basis cannot have more vectors than the dimension.');
if(rowsIn.some(r=>r.some(v=>bitsB(v)>LIMITS.lllEntryBits)))throw Error(`Entries capped at ${LIMITS.lllEntryBits} bits for exact rational arithmetic.`);
/* exact rational arithmetic with BigInt numerators/denominators */
const gcdR=(a,b)=>{a=a<0n?-a:a;b=b<0n?-b:b;while(b){const t=a%b;a=b;b=t;}return a;};
function frac(n,d=1n){
if(d===0n)throw Error('zero denominator');
if(d<0n){n=-n;d=-d;}
const g=gcdR(n,d)||1n;
return [n/g,d/g];
}
const add=(x,y)=>frac(x[0]*y[1]+y[0]*x[1],x[1]*y[1]);
const sub=(x,y)=>frac(x[0]*y[1]-y[0]*x[1],x[1]*y[1]);
const mul=(x,y)=>frac(x[0]*y[0],x[1]*y[1]);
const div=(x,y)=>frac(x[0]*y[1],x[1]*y[0]);
const cmp=(x,y)=>{const l=x[0]*y[1],r=y[0]*x[1];return l<r?-1:l>r?1:0;};
const roundF=x=>{const nn=x[0],d=x[1];return nn>=0n?(2n*nn+d)/(2n*d):-((-2n*nn+d)/(2n*d));};
let B=rowsIn.map(r=>r.map(v=>frac(v)));
const n=B.length;
const dot=(u,v)=>u.reduce((s,x,i)=>add(s,mul(x,v[i])),frac(0n));
function gs(){
const Bs=[],mu=Array.from({length:n},()=>Array(n).fill(frac(0n)));
for(let i=0;i<n;i++){
let v=B[i].slice();
for(let j=0;j<i;j++){
const den=dot(Bs[j],Bs[j]);
mu[i][j]=den[0]===0n?frac(0n):div(dot(B[i],Bs[j]),den);
v=v.map((x,k)=>sub(x,mul(mu[i][j],Bs[j][k])));
}
Bs.push(v);
}
return {Bs,mu};
}
if(gs().Bs.some(v=>dot(v,v)[0]===0n))throw Error('Basis vectors are linearly dependent — LLL needs a genuine basis.');
const delta=frac(BigInt(Math.round(deltaNum*10000)),10000n);
let k=1,swaps=0,reductions=0,guard=0;
while(k<n&&guard<20000){
guard++;
let {Bs,mu}=gs();
for(let j=k-1;j>=0;j--){
const q=roundF(mu[k][j]);
if(q!==0n){
B[k]=B[k].map((x,t)=>sub(x,mul(frac(q),B[j][t])));
reductions++;
({Bs,mu}=gs());
}
}
const left=dot(Bs[k],Bs[k]);
const right=mul(sub(delta,mul(mu[k][k-1],mu[k][k-1])),dot(Bs[k-1],Bs[k-1]));
if(cmp(left,right)>=0)k++;
else{const t=B[k];B[k]=B[k-1];B[k-1]=t;k=Math.max(k-1,1);swaps++;}
}
const out=B.map(r=>r.map(x=>x[0]/x[1]));
const norm2=v=>v.reduce((s,x)=>s+x*x,0n);
const before=rowsIn.map(norm2),after=out.map(norm2);
let detLine='';
if(n===dim){
const d0=detB(rowsIn),d1=detB(out);
detLine=`determinant: ${d0} → ${d1}   preserved up to sign: ${(d0===d1||d0===-d1)?'✓':'✗'}`;
}
const mvB=magVals(before),mvA=magVals(after);
return{
html:dim===2&&n===2?plotLattice(rowsIn.map(r=>r.map(Number)),out.map(r=>r.map(Number))):barsPlot(mvA.vals,after.map((_,i)=>'b'+(i+1)),{ylab:mvA.lab,label:'Reduced basis vector lengths (squared norms)'}),
encoded:`delta = ${deltaNum}
dimension ${dim}, basis size ${n}
input basis (squared norms ${before.join(', ')}):
${rowsIn.map(r=>'  ['+r.join(', ')+']').join('\n')}
reduced basis (squared norms ${after.join(', ')}):
${out.map(r=>'  ['+r.join(', ')+']').join('\n')}
size reductions: ${reductions}
swaps: ${swaps}
${guard>=20000?'WARNING: iteration guard reached — result may not be fully reduced.':''}
${detLine}`,
decoded:`LLL alternates two operations: size reduction (subtract integer multiples of earlier vectors to shrink the Gram-Schmidt coefficients) and the Lovász swap (exchange consecutive vectors when the orthogonality condition fails).
The output generates exactly the same lattice — the determinant is preserved up to sign, and the lab verifies it with exact integer arithmetic (Bareiss elimination) — but with much shorter, more nearly orthogonal vectors. LLL guarantees ‖b₁‖ ≤ 2^((n−1)/2)·λ₁, an approximation, not the exact shortest vector.
This lab uses exact rational arithmetic with BigInt numerators and denominators, so there is no floating-point drift. Real implementations use floating point or integral Gram-Schmidt for speed, with careful stability analysis.
PSLQ, the other algorithm in this lesson, uses a related lattice construction to find integer relations among real numbers.`};
}

let labBusy=false,flashTimer=null;
function runLab(l,initial){
if(labBusy)return;
const inputEl=$('#labInput'),seedEl=$('#labSeed');
if(!inputEl||!seedEl)return;
const input=inputEl.value;
const seed=clampInt(seedEl.value,42,0,999999);
state.seed=seed;R=mulberry32(seed||1);
const fn=DEMOS[l.demo];
const finish=res=>{
labBusy=false;
const btn=$('#runLab');
if(btn){btn.disabled=false;btn.classList.remove('busy');btn.textContent='Run lab';}
const plot=$('#labPlot'),encEl=$('#labEncoded'),dec=$('#labDecoded'),st=$('#labStatus'),cp=$('#copyOut');
if(!plot||!encEl||!dec||!st)return;
st.removeAttribute('aria-busy');
if(res.error){
plot.hidden=true;plot.innerHTML='';
encEl.textContent='Input or runtime error';
dec.textContent=res.error;
st.textContent='Failed · fix the input and run again';st.dataset.state='err';
if(cp)cp.disabled=true;
if(!initial)toast('Lab failed: check the input format');
return;
}
plot.innerHTML=res.html||'';
plot.hidden=!res.html;
encEl.textContent=res.encoded;
dec.textContent=res.decoded;
st.textContent=`Done in ${res.ms.toFixed(1)} ms · seed ${seed} · exact BigInt arithmetic · teaching implementation`;
st.dataset.state='ok';
if(cp)cp.disabled=false;
encEl.classList.add('flash');dec.classList.add('flash');
if(flashTimer)clearTimeout(flashTimer);
flashTimer=setTimeout(()=>{encEl.classList.remove('flash');dec.classList.remove('flash');},600);
if(!initial){save();toast('Lab complete');}
};
const compute=()=>{
const t0=performance.now();
let res;
try{
if(!fn)throw Error('No interactive implementation is available for this lesson.');
res=fn(input);
}catch(e){res={error:String(e&&e.message||e)};}
res.ms=performance.now()-t0;
return res;
};
if(initial){finish(compute());return;}
labBusy=true;
const btn=$('#runLab'),st=$('#labStatus');
if(btn){btn.disabled=true;btn.classList.add('busy');btn.textContent='Running…';}
if(st){st.textContent='Running…';st.dataset.state='';st.setAttribute('aria-busy','true');}
setTimeout(()=>finish(compute()),30);
}

else if(e.key==='?'){e.preventDefault();showShortcuts();}
else if(k==='t'){state.theme=state.theme==='dark'?'light':state.theme==='light'?'system':'dark';applyTheme();save();toast('Theme: '+state.theme);}
else if(k==='n'&&state.current){const i=LESSONS.indexOf(byId[state.current]);openLesson(LESSONS[(i+1)%LESSONS.length].id);}
else if(k==='p'&&state.current){const i=LESSONS.indexOf(byId[state.current]);openLesson(LESSONS[(i-1+LESSONS.length)%LESSONS.length].id);}
else if(k==='b'&&state.current&&$('#bookmarkBtn'))$('#bookmarkBtn').click();
else if(k==='m'&&state.current&&$('#completeBtn'))$('#completeBtn').click();
else if(k==='r'&&$('#runLab')){e.preventDefault();$('#runLab').click();}
});
}
function init(){
try{
load();
applyTheme();
CHAPTERS.forEach(c=>{const op=document.createElement('option');op.value=c.id;op.textContent=c.title;$('#chapterFilter').appendChild(op);});
syncControls();
bindGlobal();
renderTree();
const hash=location.hash.replace(/^#/,'');
if(hash&&byId[hash])renderLesson(hash);
else if(hash==='progress')renderProgressPage();
else if(state.current&&byId[state.current])renderLesson(state.current);
else renderHome();
progress();
}catch(e){
const mv=document.getElementById('mainView');
if(mv){mv.textContent='';const pre=document.createElement('pre');pre.style.color='var(--bad)';pre.textContent='Initialization error: '+String(e&&e.stack||e);mv.appendChild(pre);}
if(window.console)console.error(e);
}
}
init();
})();
</script>
</body>
</html>
